[package]
name = "orchestrator-desktop"
version = "2026.9.12"
edition = "2021"
description = "Desktop shell for orchd: the daemon and its web UI in one window"
repository = "https://github.com/kbarendrecht/orchestrator"
license = "AGPL-3.0-only"
authors = ["Kars Barendrecht <18546657+kbarendrecht@users.noreply.github.com>"]
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.6"

[dependencies]
orchd = { path = ".." }
anyhow = { workspace = true }
# `webview-data-url` because the splash is a `data:` URL rather than a file
# (`splash_url`). Without the feature tauri refuses the URL and the window never
# opens at all: "invalid window url: data URLs are not supported".
# `macos-private-api` is what `transparent(true)` needs on macOS, and it is worth
# naming rather than leaving as a feature flag somebody finds later: it opts the
# app into private Apple APIs, which Apple's own guidance says makes a build
# ineligible for the App Store. Nothing else here depends on it, and
# `window_transparent` defaults to false — so an install that never asks for a
# see-through window is unaffected by it being compiled in.
tauri = { version = "2.11", features = ["webview-data-url", "macos-private-api"] }
# The native folder picker for first run, when there is no config to read a
# checkout out of.
tauri-plugin-dialog = "2.7"
# `ResizeDirection` is not re-exported by `tauri`, and a frameless window needs
# it to resize. Kept in lockstep with tauri's own dependency on it.
tauri-runtime = "2.11"
# `time` and `net` are not incidental: `enable_all()` silently skips the timer
# and io drivers unless they are asked for, and the teardown path builds its own
# runtime rather than borrowing orchd's. Relying on feature unification through
# orchd would make that work by accident.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Linux only, and pinned to whatever the WebKitGTK stack already resolves to:
# `Ctrl+Shift+Tab` is a GTK focus-chain accelerator that GTK consumes before the
# page can see it, so the previous-session chord needs intercepting at the gtk
# window. Same version tauri's `gtk` is, so `gtk_window()`'s type matches.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
