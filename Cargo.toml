[workspace]
members = ["desktop"]

[package]
name = "orchd"
version = "2026.8.10"
edition = "2021"

# The daemon is a library so the desktop shell can embed it in-process, and a
# binary so it still runs headless in a terminal.
[lib]
name = "orchd"
path = "src/lib.rs"

[[bin]]
name = "orchd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws", "macros"] }
bytes = "1"
futures = "0.3"
portable-pty = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 2

[dev-dependencies]
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
