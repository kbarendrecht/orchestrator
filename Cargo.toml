[workspace]
members = ["crates/orchd-base", "desktop"]

# The four crates both this daemon and the desktop shell depend on. One version
# each, in one place: they were declared twice and could drift, and a version skew
# between the two halves of one binary surfaces as a baffling trait error rather
# than as a version complaint.
#
# **Versions only — features stay with the member that needs them.** Putting
# `features` here would silently hand every member the union, and
# `desktop/Cargo.toml` lists exactly the tokio features it needs *and says why*
# (`enable_all` skips the timer and io drivers unless asked). Inheriting `full`
# from here would quietly make that comment a lie.
[workspace.dependencies]
anyhow = "1"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Applied to both crates through `[lints] workspace = true`.
#
# **`deny`, not `forbid`.** `forbid` cannot be lifted by an inner `allow`, so it
# would make the three modules that legitimately call libc uncompilable rather than
# exceptional. `deny` keeps the rule — a new `unsafe` anywhere else is a compile
# error until somebody says out loud where it lives — while `pty.rs`, `proc.rs` and
# `instance.rs` opt in at the top of the file with the reason beside it.
#
# Six `unsafe` sites in the tree, every one a single libc call: `killpg`,
# `getpgid`, `getpgrp`, `kill`, `flock`. "Zero unsafe outside the libc calls, all
# argued" was already true; this is what makes it enforceable.
#
# Deliberately *not* here, both measured rather than assumed:
# `clippy::all = "warn"` is already clippy's default and would only look like
# enforcement — CI's `-D warnings` is the enforcement. And `clippy::unwrap_used`
# would cost 755 silenced sites in tests to police 5 in non-test code, every one of
# those safe by construction (`path.parent()` on a path with a file name,
# `last_mut()` straight after a push, a value guarded by a count).
[workspace.lints.rust]
unsafe_code = "deny"

# The design record is in the doc comments, and a doc comment is the one kind of
# prose in this repo that a compiler can check. Nine links were dangling when this
# was first run — `render_prompt_file` and `crate::config::transcript_slug` among
# them, both pointing at things renamed or deleted months ago — and nothing said
# so, because `cargo doc` was never run at all. A pointer to a function that no
# longer exists is worse than no pointer: it costs a reader a search before they
# learn it leads nowhere.
#
# `private_intra_doc_links` is allowed on purpose. Almost every module here is
# private and documents itself for the next person reading the source, so the
# "public item links to a private one" warning fires on the normal case rather
# than on a mistake. The one that matters is the link that goes nowhere.
#
# Run as `RUSTDOCFLAGS=-D warnings cargo doc -p orchd --no-deps
# --document-private-items` — the flags belong together, since `--no-deps` keeps
# it to our own prose and the deny is what makes it a gate.
# Five ways a daemon can die where a message would have done, denied rather than
# discussed.
#
# This was written off once, and the note said why: policing a few dozen real
# sites would cost 755 silenced ones in tests. `clippy.toml`'s `allow-*-in-tests`
# is what removes that cost — the lints now see only the code that ships. What was
# left was 64 `unwrap`/`expect` and 19 prints, and most of it fixed itself:
# `host.rs` had **20** `lock().unwrap()`, where one panic under any of them
# poisons the mutex and every later caller panics too — in the host, which owns
# every checkout's child process. Three modules spelled `path.parent().unwrap()`
# by hand. What is left carries `#[expect(…, reason = "…")]` at the site, which
# fails when the code stops needing it.
#
# `print_stdout`/`print_stderr` are about where output belongs: a launcher-started
# app has no terminal, so a `println!` in the library is a line nobody will ever
# read. The two CLI binaries allow it at the top of the file, and that allow is the
# statement that they are CLIs.
#
# `indexing_slicing` is deliberately **not** here yet: 59 sites, 21 of them in
# `diff.rs`, which is the changed-files parser named in the one open crash report.
# That is a pass with a bug to chase, not a lint to flip.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Zero sites today, and the reason to keep it that way is `host.rs`'s own note: a
# `std::sync::Mutex` held across an `.await` is a deadlock that needs two tasks and
# a scheduling order to show itself, so it ships green.
await_holding_lock = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[package]
name = "orchd"
version = "2026.9.12"
edition = "2021"
description = "Run several Claude Code sessions over one repository from a single window"
repository = "https://github.com/kbarendrecht/orchestrator"
license = "AGPL-3.0-only"
# The AGPL is a grant *from* a copyright holder, so one has to be named or there
# is no identified licensor. The address is the GitHub noreply on purpose: it is
# what every commit is authored as, and it keeps an employer's mail domain out of
# a personal project's metadata.
authors = ["Kars Barendrecht <18546657+kbarendrecht@users.noreply.github.com>"]
# Not a crates.io library — it is an application, and the desktop shell is the
# thing people install. Set so a stray `cargo publish` cannot go through.
publish = false

# The daemon is a library so the desktop shell can embed it in-process, and a
# binary so it still runs headless in a terminal.
[lib]
name = "orchd"
path = "src/lib.rs"

[[bin]]
name = "orchd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# The primitives, split out so `cargo` enforces the boundary this repo used to
# hold with a script. `docs/crate-split.md` has the plan; every module it holds is
# re-exported from `lib.rs` at the path it always had, so `crate::git::…` still
# reads the same everywhere.
orchd-base = { path = "crates/orchd-base" }
axum = { version = "0.7", features = ["ws", "macros"] }
bytes = "1"
# `kill(pid, 0)` for the pid-liveness guards. The /proc stat it replaced was
# silently always-false off Linux, and those guards fail open.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "process", "io-util", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true

[profile.release]
opt-level = 2

[dev-dependencies]
# The scratch and git fixtures. `orchd-base` keeps them behind a feature because a
# `#[cfg(test)]` module does not reach a dependent crate's tests.
orchd-base = { path = "crates/orchd-base", features = ["test-util"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
# Driving the bootstrap router in-process (`oneshot`) so its contract is tested
# without binding a port or a browser.
tower = { version = "0.5", features = ["util"] }
