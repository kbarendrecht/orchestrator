# `unwrap` in a test is a test that fails with a panic, which is what a failing
# test is. `unwrap` in the daemon is a session's worth of state gone. That
# difference is why these lints were once written off — policing a few dozen real
# sites cost 755 silenced ones in tests — and these five switches are what removes
# the cost.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true

# One way onto a socket. Three servers in `orchd-serve` bind a loopback port and
# the third forgot `TCP_NODELAY` — a fault that fails no test, shows in no log,
# and costs ~40 ms per round trip on the one path a person feels. `serving::spawn`
# is the call now, and it allows this lint at the one site that may make it.
disallowed-methods = [
    { path = "axum::serve", reason = "use `crate::serving::spawn`, which sets TCP_NODELAY" },
]

