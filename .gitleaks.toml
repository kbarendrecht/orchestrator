# What a secret scanner may stop reporting here, and why.
#
# **One entry, and it is not a secret.** `dGhlIHNhbXBsZSBub25jZQ==` is base64 for
# "the sample nonce": the literal example key from RFC 6455 §1.3, which every
# WebSocket handshake test in the world sends. A scanner reads it as a
# `generic-api-key` and advises revoking it, which would mean revoking a sentence
# in a standard.
#
# The bar for adding to this file is that the string cannot authenticate anything,
# anywhere — not that it is inconvenient. A real credential belongs nowhere in
# this tree, and the daemon's own tokens are minted per run.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "the RFC 6455 example WebSocket nonce, in the handshake tests"
regexes = ["dGhlIHNhbXBsZSBub25jZQ=="]
