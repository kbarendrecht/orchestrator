[tools]
# `claude-code`, not `claude`: same tool and the same `claude` binary either way,
# but a monorepo may pin it under this name, so one `mise up` there covers the agent
# this daemon spawns instead of leaving a second copy to drift.
claude-code = "latest"
node = "latest"
rust = "latest"
# `gh` is a *task* dependency, not the daemon's: the review flow reaches GitHub
# through `curl` and resolves its token itself, so nothing in `orchd` needs this
# binary. `mise run release` asks CI whether the commit is green and `mise run
# fixture` builds a throwaway repo, and both refuse without it.
#
# Declared because it was working by accident. It is on this machine from a
# *global* mise config, so a fresh clone had a release task that could not run and
# nothing saying why — the same class of thing as a rule derived from one repo.
gh = "latest"

# The SPA checks and the browser-driving tasks need `tools/node_modules`, and that
# was a sentence in a comment and an error in the pre-commit hook. Declared as a
# task instead, with `sources`/`outputs` so mise skips it when nothing changed —
# so `mise run e2e` on a fresh clone installs what it needs rather than failing on
# a missing module.
#
# `--prefix tools` rather than a `dir`, because npm resolves its lockfile relative
# to the prefix and this task can then be depended on from anywhere.
[tasks.deps]
description = "Install the SPA and tooling dependencies (tools/node_modules)"
dir = "{{config_root}}"
sources = ["tools/package.json", "tools/package-lock.json"]
outputs = ["tools/node_modules/.package-lock.json"]
run = "npm install --prefix tools --no-audit --no-fund"

# Screenshot the running app from a terminal — the only way to check a UI change
# when you cannot see the screen. Needs the app running and **Chrome installed**,
# which is the one dependency `[tools]` cannot carry: `tools/` pins
# `playwright-core` to the version whose WebKit build is already on disk, and
# playwright drives a browser it does not install.
#
#   mise run shot
#   mise run shot -- '.drawer-head'
#   mise run shot -- '.rvblock' --click '#rvhead'
# The SPA is hand-written JavaScript that ships exactly as written — no bundler,
# no emit. These are the two checks that keep it honest:
#
#   * `tsc --noEmit` type-checks it against `web/snapshot.d.ts`, which `cargo test`
#     generates from the Rust structs. Rename a snapshot field on the daemon side
#     and this fails, instead of the field reading `undefined` and rendering blank.
#   * `depcruise` holds the module graph acyclic. ES modules allow cycles, so
#     nothing else would notice one coming back — and three had to be broken to
#     make these modules a layering rather than six files that call each other.
[tasks.check-web]
description = "Type-check the SPA and enforce its module graph"
depends = ["deps"]
dir = "{{config_root}}"
run = "sh tools/check-web.sh"

# What ships inside the binaries: advisories, licences, banned crates, unknown
# sources, and dependencies nothing uses. `deny.toml` carries the argument for
# each. Also in `health.yml`, weekly — an advisory arrives without a commit, so a
# per-push check alone would never see one.
#
# The tools are not in `[tools]`: they are needed by this task and by CI, not by
# anyone building the app, and CI installs them from prebuilt binaries.
#   cargo install cargo-deny@0.20.2 cargo-machete@0.9.2 typos-cli@1.50.1
#
# The versions are pinned in `health.yml` and matter: these linters parse the
# config they are given, and the first CI run of this failed on a `deny.toml`
# licence spelling that one version wants and another refuses.
[tasks.check-deps]
description = "Advisories, licences, unused dependencies and spelling"
dir = "{{config_root}}"
run = """
cargo deny --workspace check
cargo machete
typos
"""

# Regenerate the Rust third-party notices. `THIRD-PARTY.md` explains the
# obligation for the vendored JavaScript; this is the same one for ~490 crates,
# which had no notice at all. CI regenerates and diffs, like `snapshot.d.ts`.
#
# **`--workspace`, since the split.** Without it `cargo about` reads the crate in
# the current directory — `orchd`, which no longer produces a binary — and the
# notices then miss whatever `orchd-serve` and the desktop shell pull in. The
# shipped binaries are what the obligation is about.
#   cargo install cargo-about@0.9.2 --features cli
[tasks.notices]
description = "Regenerate THIRD-PARTY-RUST.md from Cargo.lock"
dir = "{{config_root}}"
run = "cargo about generate --fail --workspace about.hbs > THIRD-PARTY-RUST.md"

# The doc comments are the design record here, so they are the one prose in this
# repo a compiler can check. Nine links were dangling the first time this ran,
# pointing at functions renamed or deleted months ago — `cargo doc` had never been
# run at all. `--document-private-items` because nearly every module is private
# and documents itself for whoever reads the source next.
#
# Not in the pre-commit hook: clippy already costs ~7s of a Rust commit, and a
# dead link is not a build people can trip over. CI is the gate.
# The daemon's module graph, which is the SPA's rule pointed at the crates. It was
# the inverse of that DAG — 17 mutual pairs and a 16-module strongly connected
# component, reported by nothing — and it was a ratchet on a shrinking baseline
# until the count reached zero. Now it refuses a cycle outright, the way
# `dependency-cruiser` does over `web/js`; `tools/rust-modules.mjs` has the
# argument for the swap.
#
#   mise run check-modules
#   node tools/rust-modules.mjs --dot     # to look at it
[tasks.check-modules]
description = "Refuse a cycle in the daemon's module graph"
dir = "{{config_root}}"
run = "node tools/rust-modules.mjs"

[tasks.check-ship]
# Every binary the workspace builds reaches every way of installing it. Derived
# from `cargo metadata`, so a new one fails this until it is placed — see #16,
# which shipped a release the app could not start from.
description = "Refuse a binary the release would not ship"
dir = "{{config_root}}"
run = "node tools/check-ship.mjs"

[tasks.app-check]
# Drives the built app: opens a checkout, makes a session, restarts, and looks for
# it again. Needs a display, so it is macOS in CI and a desktop session locally.
description = "Drive the real app: a session has to survive a restart"
dir = "{{config_root}}"
run = "node tools/app-check.mjs target/debug/orchestrator-desktop"

[tasks.deflake]
# Every flow N times in a row, one at a time. A measurement, not a gate — run it
# after touching the harness or when a run failed once and nobody can say whether
# that meant anything.
description = "Run every e2e flow repeatedly and name the flaky ones"
depends = ["deps"]
dir = "{{config_root}}"
run = "node tools/e2e/deflake.mjs"

[tasks.check-docs]
# Two kinds of prose, one task, because both fail the same way: silently.
# `cargo doc` answers whether an intra-doc link resolves; `check-assumptions.mjs`
# answers whether `docs/assumptions.md` keeps the format its own header demands —
# four of its twenty-seven entries had dropped the `*Breaks:*` half, which that
# header calls "the only reason to write the list".
description = "Check the doc comments' links, the prose's paths, and the two prose files with a format"
dir = "{{config_root}}"
run = """
RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --document-private-items
node tools/check-assumptions.mjs
node tools/check-doc-paths.mjs
node tools/check-traps.mjs
"""

[tasks.shot]
description = "Screenshot the running SPA (optionally one selector)"
depends = ["deps"]
dir = "{{config_root}}"
run = "node tools/shot.mjs"

# Asks both engines whether a hovered row survives being rebuilt. Needs no daemon
# and no checkout: the page under test is its own, because what is measured is the
# engine's rule rather than orchd's.
[tasks.hover-check]
description = "Does a hovered row survive a rebuild — chromium against webkit"
depends = ["deps"]
dir = "{{config_root}}"
run = "node tools/hover-engine-check.mjs"

# Attaches to a daemon you already have open and watches it work. Not a gate:
# the number that matters is per workload, so there is nothing to deny against.
[tasks.paint-check]
description = "Count which panes rebuild while agents work, and name what moved"
depends = ["deps"]
dir = "{{config_root}}"
run = "node tools/paint-check.mjs"

# The README's demo GIF, recorded against a *running* daemon on a prepared
# checkout — `docs/demo.md` says which, and why it cannot be the e2e sandbox.
# Drives a real `claude`, so it costs tokens and is not part of any gate.
#
#   mise run demo                                        # one repository
#   mise run demo -- --multi  --out docs/demo-repos.gif   # two, side by side
#   mise run demo -- --panes  --out docs/demo-panes.gif   # the PR and review panes
#   mise run demo -- --revive --out docs/demo-revive.gif  # diff, then a daemon kill
[tasks.demo]
description = "Record the README's demo GIF against a running daemon"
depends = ["deps"]
dir = "{{config_root}}"
run = "node tools/demo.mjs"

# Build a throwaway PR with review threads whose last word is not yours, which is
# the one precondition the resolve flow cannot be verified without. Creates a
# private GitHub repo and a daemon config dir under ~/.cache; see docs/fixture-pr.md.
#
#   mise run fixture
#   mise run fixture -- --threads 5
#   mise run fixture -- --destroy
[tasks.fixture]
description = "Build a throwaway PR to drive the review flow against"
dir = "{{config_root}}"
run = "node tools/fixture-pr.mjs"

# Drive the main flows against a real daemon: open a worktree, open main, fork
# either, swap both ways, run fix-pr. Offline and deterministic, because the agent
# and the GitHub calls are PATH shims — everything else is real, down to the git
# worktrees and the branch moves. `docs/e2e.md` has the design and its limits.
#
#   mise run e2e
#   mise run e2e -- swap        # only the flows whose name matches
#   mise run e2e -- --keep      # keep each sandbox to read afterwards
#
# Not in the pre-commit hook: it is ~45s and builds the daemon, where the hook is
# ~2s. Run it before anything touching spawn, worktrees, the swap, restart or
# fix-pr.
[tasks.e2e]
description = "Drive the main user flows against a real daemon"
dir = "{{config_root}}"
run = "node tools/e2e/run.mjs"

# Drive the terminal in a real browser against a real daemon: attach a pane, type
# and see the pty echo, drop the socket and watch it reconnect, and type while it
# is down to prove nothing is lost (#7). Separate from `e2e` because it needs
# Chrome, where that suite is headless. `tools/e2e/term.mjs` explains the setup.
#
#   mise run term-e2e
#   mise run term-e2e -- --keep   # keep the sandbox to read afterwards
[tasks.term-e2e]
description = "Drive the terminal pane in a real browser"
depends = ["deps"]
dir = "{{config_root}}"
run = "cargo build -p orchd-serve --bin orchd && node tools/e2e/term.mjs"

# What the rendered page must never show: an unresolved `MOD` placeholder, the
# word `undefined` where a person reads, two sets of window buttons, or anything
# thrown at boot. Every one of those has happened here.
#
# **Not screenshots, and that is the decision.** A pixel baseline would police
# layout and copy, which is what most commits here change, so every intentional
# change would arrive red and be answered with a blind baseline update — the same
# habit as `--no-verify`. It would also police Chrome, while the app ships
# WebKitGTK and WKWebView. These four assertions are text, so they are stable.
#
#   mise run page-check
#   mise run page-check -- --mac   the macOS chrome, simulated
[tasks.page-check]
description = "Assert what the rendered page must never show"
depends = ["deps"]
dir = "{{config_root}}"
run = "cargo build -p orchd-serve --bin orchd && node tools/e2e/page.mjs"

# Which renderer each terminal opens with, asserted instead of eyeballed. Proves
# the *decision* — one live WebGL context per window on macOS (#8) — not that the
# glyphs are right, which needs a real Mac. `tools/e2e/renderer.mjs` says why.
#
#   mise run renderer-check
#   mise run renderer-check -- --mac   # the macOS rule, simulated
[tasks.renderer-check]
description = "Assert which renderer each terminal opens with"
depends = ["deps"]
dir = "{{config_root}}"
run = "cargo build -p orchd-serve --bin orchd && node tools/e2e/renderer.mjs"

# Cut a release, refusing while CI has not answered for the commit you are on.
#
# The rule this enforces: **`check` is what runs the tests on macOS, and the
# release workflow only tells you afterwards.** A tag pushed before that run is
# green is a tag that may publish nothing — and then the version number is spent,
# the tag has to be deleted by hand, and the next one starts over. It has happened
# twice, both times a test that passed on Linux and failed on macos-14.
#
#   mise run release              # bump the last CalVer component
#   mise run release -- 2027.1.1  # or say the version
#   mise run release -- --dry-run
#
# **Arguments arrive by being appended to the last line**, which is why this ends
# in `main "$@"`: mise pastes a task's arguments onto the end of the script rather
# than setting `$1`, so `$@` inside a function body is empty and `main "$@" 2027.1.1`
# is what actually runs. Measured, because the obvious spelling silently ignores
# everything you pass.
#
# POSIX shell, and no `sed -i`: a release is cut on whatever machine you are on,
# and that flag takes an argument on a Mac and not on Linux — the same trap the
# daemon avoids by never shelling out to a GNU-only flag.
[tasks.release]
description = "Bump the version, wait for CI, tag, push, and wait for the release"
dir = "{{config_root}}"
run = """
set -e

die() { printf '\\033[31m✗\\033[0m %s\\n' "$1" >&2; exit 1; }
step() { printf '\\033[36m▸\\033[0m %s\\n' "$1"; }

# Rewrite `want` occurrences of a version string, refusing any other number: a
# file with one where two were expected has moved on, and a release that bumps
# three files of four is what the workflow's own tag-matches-version step refuses
# — after the tag is pushed. `grep -c` counts *lines*, which is the same thing
# here because every version line stands alone.
bump() {
  file=$1; from=$2; to=$3; want=$4
  seen=$(grep -c "$from" "$file" || true)
  [ "$seen" = "$want" ] || die "$file has $seen of \\`$from\\`, expected $want"
  [ "$DRY" = 1 ] && { printf '  %s: %s (dry)\\n' "$file" "$want"; return 0; }
  sed "s|$from|$to|g" "$file" > "$file.bump" && mv "$file.bump" "$file"
  printf '  %s: %s\\n' "$file" "$want"
}

main() {
  DRY=0
  RETRY=0
  VERSION=""
  for a in "$@"; do
    case $a in
      --dry-run) DRY=1 ;;
      # Re-cut a version whose release never published. The refusals below are what
      # make that safe.
      --retry) RETRY=1 ;;
      -*) die "unknown flag $a" ;;
      *) VERSION=$a ;;
    esac
  done

  cur=$(sed -n 's/^version = "\\(.*\\)"$/\\1/p' Cargo.toml | head -1)
  [ -n "$cur" ] || die "no version line in Cargo.toml"
  if [ "$RETRY" = 1 ]; then
    # A retry re-cuts the number already in the tree. The bump commit landed with
    # the failed attempt, so `cur` *is* the version being released, and the fix
    # that made it releasable is sitting on top of it.
    [ -z "$VERSION" ] || die "--retry re-cuts the version already in Cargo.toml ($cur); do not name one"
    VERSION=$cur
  elif [ -z "$VERSION" ]; then
    # CalVer, and only the last component is bumped here: a new month is a
    # decision rather than an increment, so it is passed in.
    y=${cur%%.*}; rest=${cur#*.}; m=${rest%%.*}; n=${rest#*.}
    case $y$m$n in *[!0-9]*) die "$cur is not <year>.<month>.<n> — pass the version you want" ;; esac
    VERSION="$y.$m.$((n + 1))"
  fi
  tag="v$VERSION"
  if [ "$RETRY" = 1 ]; then
    step "re-cutting $tag"
  else
    step "releasing $cur → $VERSION"
  fi

  # Every refusal before anything is written.
  [ "$(git rev-parse --abbrev-ref HEAD)" = main ] || die "a release is cut from main"
  [ -z "$(git status --porcelain)" ] || die "the tree is dirty — commit or stash first, so the tag names what you tested"
  command -v gh >/dev/null || die "gh is not installed, so CI cannot be asked (it is in [tools]: mise install)"
  if [ "$RETRY" = 1 ]; then
    # **Overwriting only ever repairs something nobody received.** A release
    # carrying assets is one people may have installed, and moving the tag under it
    # would change what a version means. `gh` exits non-zero when no release exists
    # at all, which is the ordinary case for a retry.
    published=$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
    [ "$published" = 0 ] \\
      || die "$tag already published $published asset(s) — bump instead; a version people can install is not one to overwrite"
  else
    [ -z "$(git tag --list "$tag")" ] || die "$tag already exists locally (--retry re-cuts one whose release never published)"
    [ -z "$(git ls-remote --tags origin "$tag")" ] || die "$tag already exists on origin (--retry re-cuts one whose release never published)"
  fi
  git fetch --quiet origin main
  behind=$(git rev-list --count HEAD..origin/main)
  [ "$behind" = 0 ] || die "main is $behind commit(s) behind origin — pull first"

  # The commit being released is HEAD, so that is the run to wait on. By sha and
  # not by branch: `--branch main` answers about whatever main pointed at when the
  # run started, which is the wrong question the moment two pushes land close
  # together.
  head=$(git rev-parse HEAD)
  step "waiting for check on $(echo "$head" | cut -c1-8)"
  deadline=$(( $(date +%s) + 1800 ))
  while :; do
    # `|| true` because this is under `set -e`: one rate limit or dropped
    # connection would otherwise abort the wait rather than retrying on the next
    # tick, and the empty answer already has an arm below.
    run=$(gh run list --workflow=check.yml --commit "$head" --limit 1 \\
            --json status,conclusion,url --jq '.[] | .status + " " + (.conclusion // "") + " " + .url' || true)
    status=$(echo "$run" | cut -d' ' -f1)
    case $status in
      completed)
        [ "$(echo "$run" | cut -d' ' -f2)" = success ] \\
          || die "check is $(echo "$run" | cut -d' ' -f2) for this commit — fix it before tagging
  $(echo "$run" | cut -d' ' -f3)"
        printf '  check succeeded — %s\\n' "$(echo "$run" | cut -d' ' -f3)"
        break
        ;;
      # No run yet is the normal answer for a push made seconds ago, which is also
      # why this polls rather than `gh run watch`: that needs an id to watch.
      "") printf '  no check run for this commit yet…\\n' ;;
      *) printf '  check is %s…\\n' "$status" ;;
    esac
    [ "$(date +%s)" -lt "$deadline" ] || die "check has not finished in 30 minutes; look at it rather than tagging blind"
    sleep 15
  done

  if [ "$RETRY" = 1 ]; then
    # Nothing to bump: the failed attempt committed these four files already,
    # and `cur` is the version they carry.
    step "version is already $VERSION from the failed attempt"
  else
    step "bumping the version"
    # **Three files, and the crate manifests are not among them.** Every member says
    # `version.workspace = true`, so the one literal is the root's
    # `[workspace.package]` and cargo refuses a disagreement — which is why this no
    # longer bumps `desktop/Cargo.toml`, and why it cannot silently miss a crate the
    # next split adds.
    bump Cargo.toml "version = \\"$cur\\"" "version = \\"$VERSION\\"" 1
    bump desktop/tauri.conf.json "\\"version\\": \\"$cur\\"" "\\"version\\": \\"$VERSION\\"" 1
    # The workspace's five members, and only those: every dependency in the lock
    # carries its own version line, so the count is the check. It was 2 before the
    # crate split, which is the kind of number this `bump` refuses rather than
    # half-applies.
    bump Cargo.lock "version = \\"$cur\\"" "version = \\"$VERSION\\"" 5
    # **The notices carry the version too**, on the one line that names this
    # workspace's five crates under the AGPL heading — `cargo about` writes it out of
    # `Cargo.lock`. Left behind, `health.yml` goes red on the next push and stays
    # red, which is the worst state for that workflow to be in: its whole job is to
    # say "go and read an advisory", and a job that is always failing is one nobody
    # reads. Bumped here rather than regenerated, so a release needs no `cargo
    # about`; CI regenerates and diffs, which is what would catch a wrong guess.
    bump THIRD-PARTY-RUST.md "$cur" "$VERSION" 1
  fi

  # **The notes, before the tag exists.** `generate_release_notes: true` builds
  # them from merged pull requests, and this repo has none — so every release said
  # one compare link, for 8 commits in v2026.9.18 and 34 in v2026.9.17.
  # `release-notes.mjs` builds them from the log instead, and asks `claude` to pick
  # the handful a person upgrading would notice. Drafted here rather than in the
  # workflow because this is where a reader is: the release job has no one to show
  # a draft to, and a model's judgement is not something to publish unseen.
  # **The range starts at the last *published* release, not the last tag.** A tag
  # whose release never published names a version nobody received, so notes
  # measured from it would skip everything that attempt carried — and the compare
  # link would point at a tag that may since have been deleted. v2026.9.21 shipped
  # exactly that link, to the deleted v2026.9.20.
  base=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
  # A release with no assets is still a release, and on a retry it can be this very
  # tag — which would leave an empty range.
  [ "$base" != "$tag" ] || base=$(gh release list --limit 2 --json tagName --jq '.[1].tagName' 2>/dev/null || true)
  [ -n "$base" ] || base="v$cur"

  step "drafting the release notes"
  notes=$(mktemp)
  # Never fatal. A model call that is slow, offline or rate-limited must not block
  # a release, and the script already falls back to picking by path — but if even
  # that fails, the notes are dropped and GitHub's own line is what ships.
  if node tools/release-notes.mjs "$base..HEAD" --tag "$tag" > "$notes"; then
    printf '\\n%s\\n\\n' "$(cat "$notes")"
  else
    printf '  could not draft them; the release will carry the default body\\n'
    : > "$notes"
  fi
  # Only when somebody is there to answer. A release cut from a script keeps the
  # notes rather than hanging on a prompt nothing will type into.
  if [ -s "$notes" ] && [ -t 0 ]; then
    printf 'Use these notes? [Y/e/n] '
    read -r answer
    case $answer in
      [Nn]*) : > "$notes"; printf '  dropped\\n' ;;
      [Ee]*) "${EDITOR:-vi}" "$notes"; node tools/release-notes.mjs "$base..HEAD" --check "$notes" || die "the edited notes no longer cover the range" ;;
    esac
  fi

  [ "$DRY" = 1 ] && { printf '\\n(dry run: nothing written, nothing tagged; %s would have been pushed)\\n' "$tag"; return 0; }

  if [ "$RETRY" = 1 ]; then
    step "re-tagging and pushing"
    # The bump commit is already on main from the failed attempt and the tree is
    # clean, so there is nothing to commit. The old tag goes from both sides first:
    # `git tag -f` moves the local one, but a push of a moved tag is refused, and
    # `--force` on a tag push is the habit worth not teaching.
    git tag -d "$tag" 2>/dev/null || true
    git push --quiet origin ":refs/tags/$tag" 2>/dev/null || true
  else
    step "committing, tagging and pushing"
    git add -A
    # `--no-verify`: CI has just answered for the commit underneath this one, and a
    # version bump cannot fail the hook's checks.
    git commit --no-verify -m "Release $VERSION"
    git push origin main
  fi
  # Annotated, because the message is what the workflow publishes as the release
  # body. A lightweight tag carries none, and the release would fall back to the
  # one line this exists to replace.
  if [ -s "$notes" ]; then
    # `--cleanup=verbatim`, and it is not optional: git's default strips every
    # line beginning with `#` as a comment, which silently ate the `### What
    # changed` heading and left the release body opening on a bare list. Markdown
    # headings and git comments are the same character.
    git tag -a --cleanup=verbatim "$tag" -F "$notes"
  else
    git tag "$tag"
  fi
  git push origin "$tag"
  printf '  %s pushed\\n' "$tag"

  # **The tag is not the release.** `release.yml` runs the suite again and builds
  # every bundle, so a tag that pushed cleanly can still publish nothing. This task
  # used to stop here and print a `gh run watch` line, which meant a failed release
  # was found only by somebody going to look: v2026.9.20 sat dead for hours that
  # way. Waiting is what turns a silently spent version number into one `--retry`
  # can reclaim.
  step "waiting for the release workflow"
  # An hour: the macOS leg builds a bundle and drives it, and a queued runner is
  # not a failure. `check` gets 30 minutes because it only runs the suite.
  deadline=$(( $(date +%s) + 3600 ))
  while :; do
    # `--branch` takes the tag: a tag push reports the tag as `headBranch`, so this
    # names *this* release's run and not whatever ran last.
    run=$(gh run list --workflow=release.yml --branch "$tag" --limit 1 \\
            --json status,conclusion,url --jq '.[] | .status + " " + (.conclusion // "") + " " + .url' || true)
    case $(echo "$run" | cut -d' ' -f1) in
      completed)
        [ "$(echo "$run" | cut -d' ' -f2)" = success ] \\
          || die "the release workflow failed for $tag — fix it, then: mise run release --retry
  $(echo "$run" | cut -d' ' -f3)"
        break
        ;;
      "") printf '  no release run for %s yet…\\n' "$tag" ;;
      *) printf '  the release workflow is %s…\\n' "$(echo "$run" | cut -d' ' -f1)" ;;
    esac
    [ "$(date +%s)" -lt "$deadline" ] || die "the release workflow has not finished in an hour — look at it, then: mise run release --retry"
    sleep 20
  done

  # **A green workflow is still not an installable release.** mise and ubi resolve a
  # version from its assets, so a release carrying none exists and cannot be
  # installed — which is what v2026.9.19 shipped, green. Assert the thing people
  # actually consume.
  assets=$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
  [ "$assets" -gt 0 ] \\
    || die "$tag published no assets — fix it, then: mise run release --retry"
  printf '  %s published, %s assets\\n' "$tag" "$assets"
}

main "$@"
"""

[tasks.sweep]
# Cargo never prunes `target/`. `target/debug/deps` gains a set of test binaries
# per build and keeps every earlier one, so it reached 54 G here across 7,097
# files and filled the disk mid-commit twice in one session. It does not fail as
# "no space": it surfaced as the pre-commit hook's type export dying, which reads
# like a tooling bug and sent two people looking in the wrong place.
#
# By age rather than `cargo clean`, because a clean throws what this checkout is
# still building against and makes the next `cargo test` a cold build. Two days
# keeps today's work warm and reclaimed 42 G on the run that prompted this task.
#
# The worktree pass is the other half: each `.dev` worktree carries its own
# target, and one of them held 18 G. **Only `target/` inside a worktree, never the
# worktree** — `.dev/` holds uncommitted work on a real branch, and deleting one
# cost a full session. A path is passed per worktree rather than sweeping
# recursively, because cargo-sweep skips dot-directories unless told otherwise and
# `--hidden` would let it walk the whole of `.dev`.
description = "Reclaim stale cargo build artifacts, here and in each .dev worktree"
dir = "{{config_root}}"
run = """
set -eu

main() {
  # Days to keep. Appended by mise as a positional, so `mise run sweep -- 7`.
  days="${1:-2}"

  if ! command -v cargo-sweep >/dev/null 2>&1; then
    printf 'cargo-sweep is not installed. Install it with:\\n  cargo install cargo-sweep\\n' >&2
    exit 1
  fi

  before=$(df -k . | awk 'NR==2 {print $4}')

  # Each worktree is a cargo project in its own right, so it is a path to sweep
  # beside this one. The glob stays unexpanded when there are none, hence the -d.
  paths="."
  for w in .dev/worktree/*; do
    # An `if`, not `[ … ] && …`: that is an AND-list, and a false test in the last
    # command of a loop body ends the task under `set -e`.
    if [ -d "$w/target" ]; then
      paths="$paths $w"
    fi
  done

  # Unquoted on purpose: `paths` is a list of arguments, not one path.
  # shellcheck disable=SC2086
  cargo sweep --time "$days" $paths

  after=$(df -k . | awk 'NR==2 {print $4}')
  awk -v b="$before" -v a="$after" \\
    'BEGIN { printf "\\nreclaimed %.1f GiB, %.1f GiB now free\\n", (a - b) / 1048576, a / 1048576 }'
}

main "$@"
"""
