[tools]
# `claude-code`, not `claude`: same tool and the same `claude` binary either way,
# but acme pins it under this name, so one `mise up` there covers the agent
# this daemon spawns instead of leaving a second copy to drift.
claude-code = "latest"
node = "latest"
rust = "latest"
zig = "latest"

# Screenshot the running app from a terminal — the only way to check a UI change
# when you cannot see the screen. Needs the app running and Chrome installed;
# `npm i` in tools/ first (playwright-core only, no browser download).
#
#   mise run shot
#   mise run shot -- '.drawer-head'
#   mise run shot -- '.rvblock' --click '#rvhead'
# The SPA is hand-written JavaScript that ships exactly as written — no bundler,
# no emit. These are the two checks that keep it honest:
#
#   * `tsc --noEmit` type-checks it against `web/snapshot.d.ts`, which `cargo test`
#     generates from the Rust structs. Rename a snapshot field on the daemon side
#     and this fails, instead of the field reading `undefined` and rendering blank.
#   * `depcruise` holds the module graph acyclic. ES modules allow cycles, so
#     nothing else would notice one coming back — and three had to be broken to
#     make these modules a layering rather than six files that call each other.
[tasks.check-web]
description = "Type-check the SPA and enforce its module graph"
run = """
cargo test --lib export_bindings >/dev/null
git diff --exit-code --stat web/snapshot.d.ts \
  || { echo 'web/snapshot.d.ts was stale — the regenerated copy is in your tree; commit it.'; exit 1; }
npx --prefix tools tsc -p tools/tsconfig.json
npx --prefix tools depcruise --config tools/.dependency-cruiser.cjs web/app.js
"""

[tasks.shot]
description = "Screenshot the running SPA (optionally one selector)"
dir = "{{config_root}}"
run = "node tools/shot.mjs"
