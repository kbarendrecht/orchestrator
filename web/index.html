<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchd — session board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Martian+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="app">

  <!-- ============ CONTEXT BAR ============ -->
  <!-- Replaces the centre pane's own header, so it costs no net vertical space. -->
  <div class="top top-l">
    <span class="repo" id="repo">—</span>
    <span class="ctx-sep" style="margin-left:auto" id="upstream">develop</span>
  </div>

  <div class="top top-c">
    <span class="dot" id="ctxdot"></span>
    <span class="ctx-name" id="ctxname">no session</span>
    <span class="ctx-branch" id="ctxbranch"></span>
    <span class="ctx-sep">·</span>
    <span class="ctx-pr" id="ctxstate"></span>
    <span class="ctx-right">
      <span class="ctx-btn" id="ctxbase"></span>
      <button class="ctx-btn" id="capbtn">Tests</button>
      <button class="ctx-btn" id="diffbtn">Diff</button>
      <button class="ctx-btn" id="shellbtn">Shell</button>
      <button class="ctx-btn" id="killbtn">Kill</button>
    </span>
  </div>

  <div class="top top-r">
    <span class="eyebrow" id="filestitle">Changed files</span>
    <button class="ctx-btn" id="basebtn" style="margin-left:auto"></button>
    <button class="ctx-btn" id="refreshbtn" title="Re-read git status">&#8635;</button>
  </div>

  <!-- ============ RAIL ============ -->
  <nav class="rail" aria-label="Sessions">
    <button class="waitbar" id="waitbar"></button>
    <div class="rail-scroll" id="rail"></div>
  </nav>

  <!-- ============ CENTER ============ -->
  <main class="center">
    <!-- ============ DIFF OVERLAY ============ -->
    <div class="overlay" id="overlay">
      <div class="ov-head">
        <span class="ov-path" id="ovpath"></span>
        <div class="ov-nav">
          <span class="ov-count" id="ovcount"></span>
          <button class="head-btn" id="ovprev">Prev &#8679;F7</button>
          <button class="head-btn" id="ovnext">Next F7</button>
          <button class="head-btn" id="ovedit">Edit</button>
          <button class="head-btn" id="ovsave" hidden>Save &#8984;S</button>
          <button class="head-btn" id="ovmode">Split</button>
          <button class="head-btn" id="ovclose">Close ESC</button>
        </div>
      </div>
      <div class="diff" id="diffbody"></div>
    </div>

    <div class="termwrap" id="termwrap">
      <div class="fempty" id="termempty">
        No session selected.<br>
        Start one from the rail.
      </div>
    </div>

    <!-- Process drawer: available on every workspace, not just main. -->
    <div class="drawer empty" id="drawer">
      <div class="drawer-head">
        <span class="eyebrow" style="margin-right:2px">Processes</span>
        <span id="dtabs" style="display:flex;gap:4px"></span>
        <button class="addsh" id="addshell">+ Shell <kbd>⌃`</kbd></button>
        <span class="dcwd" id="dcwd"></span>
      </div>
      <div class="drawer-body" id="drawerbody"></div>
    </div>
  </main>

  <!-- ============ FILES ============ -->
  <aside class="files">
    <div id="filepanes"></div>
    <div class="files-foot" id="filesfoot"></div>

    <!-- Bottom-right mirrors your own PRs bottom-left: what colleagues are
         blocked on, versus what you owe yourself. -->
    <div class="rvblock" id="rvblock">
      <button class="rvhead" id="rvhead"></button>
      <div class="rvlist" id="rvlist"></div>
    </div>
  </aside>

</div>

<div class="modal" id="capmodal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="eyebrow">Test capabilities</span>
      <button class="head-btn" id="capclose">Close</button>
    </div>
    <div class="modal-body" id="capbody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.__ORCH__ = { token: "__ORCH_TOKEN__" };</script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/app.js"></script>
</body>
</html>
