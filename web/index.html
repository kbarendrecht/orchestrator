<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchd — session board</title>
<!-- Fonts are @font-face'd from app.css against the daemon's own /vendor/fonts. -->
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="app">

  <!-- ============ CONTEXT BAR ============ -->
  <!-- Replaces the centre pane's own header, so it costs no net vertical space. -->
  <div class="top top-l">
    <!-- Switching between repos is not built; the shape is here so the header
         stops pretending the fork and the upstream are the same thing. -->
    <button class="repo-switch" id="reposwitch" title="Switch repository">
      <span class="repo-main" id="repoupstream">—</span>
      <span class="repo-fork" id="repofork"></span>
    </button>
    <!-- Sliders rather than a gear glyph: the font stack has no dependable one at
         this size, which is why the window controls are drawn too. -->
    <button class="gear" id="gearbtn" title="Settings" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M2 5h5M11 5h3M2 11h8M14 11h0M12 11h2"/>
          <circle cx="9" cy="5" r="1.8" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="11" r="1.8" fill="currentColor" stroke="none"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="top top-c">
    <span class="dot" id="ctxdot"></span>
    <span class="ctx-name" id="ctxname">no session</span>
    <span class="ctx-branch" id="ctxbranch"></span>
    <span class="ctx-sep">·</span>
    <span class="ctx-pr" id="ctxstate"></span>
    <span class="ctx-right">
      <button class="ctx-close" id="killbtn" title="End this session">&#10005;</button>
    </span>
  </div>

  <div class="top top-r">
    <span class="eyebrow" id="filestitle">Changes</span>
    <span class="ctx-btn" id="filesbase" style="margin-left:auto"
          title="Everything changed since this workspace branched"></span>
    <button class="refresh" id="refreshbtn" title="Re-read git status">&#8635;</button>

    <!-- Frameless-window controls. Present in the markup always, revealed by
         `data-chrome="custom"` on the body; macOS keeps its real traffic
         lights instead and never shows these. -->
    <div class="wctl" id="wctl">
      <button class="wctl-btn" data-cmd="minimize" title="Minimise" aria-label="Minimise"></button>
      <button class="wctl-btn" data-cmd="toggle-maximize" title="Maximise" aria-label="Maximise"></button>
      <button class="wctl-btn close" data-cmd="close" title="Close" aria-label="Close"></button>
    </div>
  </div>

  <!-- ============ RAIL ============ -->
  <nav class="rail" aria-label="Sessions">
    <button class="waitbar" id="waitbar"></button>
    <div class="rail-scroll" id="rail"></div>
    <!-- Pinned to the bottom, mirroring the review queue bottom-right: what you
         owe yourself on the left, what colleagues are blocked on on the right. -->
    <div class="prblock" id="prpane"></div>
  </nav>

  <!-- ============ CENTER ============ -->
  <main class="center">
    <!-- ============ DIFF OVERLAY ============ -->
    <div class="overlay" id="overlay">
      <div class="ov-head">
        <span class="ov-path" id="ovpath"></span>
        <div class="ov-nav">
          <span class="ov-count" id="ovcount"></span>
          <button class="head-btn" id="ovprev">Prev &#8679;F7</button>
          <button class="head-btn" id="ovnext">Next F7</button>
          <button class="head-btn" id="ovedit">Edit</button>
          <button class="head-btn" id="ovsave" hidden>Save &#8984;S</button>
          <button class="head-btn" id="ovmode">Split</button>
          <button class="head-btn" id="ovclose">Close ESC</button>
        </div>
      </div>
      <div class="diff" id="diffbody"></div>
    </div>

    <!-- ============ REVIEW OVERLAY ============ -->
    <!-- Rendered entirely by renderReview(): it is six screens rather than one
         layout, so markup here would be five hidden shells. Ids inside take an
         `rv-` prefix — classes can be shared with the diff overlay above, ids
         cannot. -->
    <div class="overlay rv" id="rvoverlay"></div>

    <div class="termwrap" id="termwrap">
      <div class="fempty" id="termempty">
        Nothing running.<br>
        Start a session from the rail, or open one from its archive.
      </div>
    </div>

    <!-- Process drawer: available on every workspace, not just main. -->
    <div class="drawer empty" id="drawer">
      <div class="drawer-head">
        <span class="eyebrow" style="margin-right:2px">Processes</span>
        <span id="dtabs" style="display:flex;gap:4px"></span>
        <button class="addsh" id="addshell">+ Shell <kbd>⌃`</kbd></button>
        <span class="dcwd" id="dcwd"></span>
      </div>
      <div class="drawer-body" id="drawerbody"></div>
    </div>
  </main>

  <!-- ============ FILES ============ -->
  <aside class="files">
    <!-- Divergence first: when the branch is behind, that is the thing worth
         acting on, not the file list under it. -->
    <div class="diverge" id="diverge"></div>
    <div id="filepanes"></div>
    <div class="files-foot" id="filesfoot"></div>

    <!-- Bottom-right mirrors your own PRs bottom-left: what colleagues are
         blocked on, versus what you owe yourself. -->
    <div class="rvblock" id="rvblock">
      <button class="rvhead" id="rvhead"></button>
      <div class="rvlist" id="rvlist"></div>
    </div>
  </aside>

</div>

<!-- Resize hot-zones. A frameless window has no WM border to grab, so these
     invisible strips put one back. Hidden unless the daemon says we are
     frameless; macOS keeps its decorations and needs none of this. -->
<div class="resizers" id="resizers">
  <div class="rz rz-n"  data-edge="north"></div>
  <div class="rz rz-s"  data-edge="south"></div>
  <div class="rz rz-e"  data-edge="east"></div>
  <div class="rz rz-w"  data-edge="west"></div>
  <div class="rz rz-ne" data-edge="north-east"></div>
  <div class="rz rz-nw" data-edge="north-west"></div>
  <div class="rz rz-se" data-edge="south-east"></div>
  <div class="rz rz-sw" data-edge="south-west"></div>
</div>

<!-- A newer release exists. Notice only: `mise up` does the upgrade. Shown until
     dismissed, and again when a version newer than the dismissed one lands. -->
<div class="updatebar" id="updatebar" hidden>
  <a class="updatebar-link" id="updatelink" target="_blank" rel="noreferrer"></a>
  <span class="updatebar-x" id="updatex" role="button" title="Dismiss">&#10005;</span>
</div>

<!-- Right-click on a session row. Positioned at the cursor from script. -->
<!-- Column splitters. Drag to resize, double-click to reset. Fixed strips over
     the grid's own boundaries, so the grid itself stays two variables wide. -->
<div class="split split-l" id="splitl" role="separator" aria-orientation="vertical"
     title="Drag to resize · double-click to reset"></div>
<div class="split split-r" id="splitr" role="separator" aria-orientation="vertical"
     title="Drag to resize · double-click to reset"></div>

<!-- Settings. One panel, opened from the sliders in the top-left. -->
<div class="settings" id="settings" hidden>
  <div class="settings-row">
    <span class="settings-k">Font size</span>
    <span class="settings-step">
      <button class="stepbtn" id="fsdown" title="Smaller">&#8722;</button>
      <span class="stepval" id="fsval">100%</span>
      <button class="stepbtn" id="fsup" title="Bigger">+</button>
    </span>
  </div>
  <button class="settings-reset" id="fsreset">Reset to 100%</button>
</div>

<div class="ctxmenu" id="ctxmenu" role="menu" hidden></div>

<div class="toast" id="toast"></div>

<script>window.__ORCH__ = { token: "__ORCH_TOKEN__", chrome: "__ORCH_CHROME__" };</script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/app.js"></script>
</body>
</html>
