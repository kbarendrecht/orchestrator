[package]
name = "orchd"
version = "2026.9.12"
edition = "2021"
description = "Run several Claude Code sessions over one repository from a single window"
repository = "https://github.com/kbarendrecht/orchestrator"
license = "AGPL-3.0-only"
# The AGPL is a grant *from* a copyright holder, so one has to be named or there
# is no identified licensor. The address is the GitHub noreply on purpose: it is
# what every commit is authored as, and it keeps an employer's mail domain out of
# a personal project's metadata.
authors = ["Kars Barendrecht <18546657+kbarendrecht@users.noreply.github.com>"]
# Not a crates.io library — it is an application, and the desktop shell is the
# thing people install. Set so a stray `cargo publish` cannot go through.
publish = false

# A library only. The binaries moved to `orchd-serve` with the server they start;
# this crate is what that one assembles.
[lib]
name = "orchd"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
# The primitives, split out so `cargo` enforces the boundary this repo used to
# hold with a script. `docs/crate-split.md` has the plan; every module it holds is
# re-exported from `lib.rs` at the path it always had, so `crate::git::…` still
# reads the same everywhere.
orchd-base = { path = "../orchd-base" }
# One checkout described: config, the forge, diffs, patches, skills, the launch
# argv. Re-exported from `lib.rs` at the paths they had, like `orchd-base`.
orchd-repo = { path = "../orchd-repo" }
# Generates `web/snapshot.d.ts`. Optional rather than a dev-dependency, for the
# reason `orchd-base` gives: as a dev-dependency the derives exist only while this
# crate's own tests build.
ts-rs = { version = "12.0.1", features = ["uuid-impl"], optional = true }
axum = { version = "0.7", features = ["ws", "macros"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "process", "io-util", "fs"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# The `AppState` fixtures, and the `TS` derives that go with them. The same shape
# `orchd-base` needed and for the same reason: a `#[cfg(test)]` item is invisible
# to a *dependent* crate's tests, and `orchd-serve`'s tests are exactly that.
test-util = ["dep:ts-rs", "orchd-base/test-util", "orchd-repo/test-util"]

[lints]
workspace = true


[dev-dependencies]
# The scratch and git fixtures. `orchd-base` keeps them behind a feature because a
# `#[cfg(test)]` module does not reach a dependent crate's tests.
orchd-base = { path = "../orchd-base", features = ["test-util"] }
orchd-repo = { path = "../orchd-repo", features = ["test-util"] }
# Also a dev-dependency: `cfg(test)` is true for this crate's own tests while the
# feature is not, so the optional copy above is not linked then. Without this,
# `cargo test -p orchd` alone fails to build while `--workspace` succeeds, because
# a sibling's dev-dependency turns the feature on in the unified graph.
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
# Driving the bootstrap router in-process (`oneshot`) so its contract is tested
# without binding a port or a browser.
tower = { version = "0.5", features = ["util"] }
