name = "orchd-ping"
main = "worker.js"
compatibility_date = "2026-10-01"

# Off, and said here so every deploy keeps it off: Workers Logs would keep each
# request's metadata, the client address with it, and the README promises the
# address is not stored.
[observability]
enabled = false

# Ten pings a minute per address.
# See the comment at the limiter call in worker.js.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "orchd-pings"
database_id = "3d16bb45-e822-4e98-bfcc-d08bbe703d12"
