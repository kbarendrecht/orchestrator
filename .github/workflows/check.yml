name: check

# Does it still build and pass on both platforms?
#
# This exists because `release.yml` only runs on a tag, which made cutting a
# release the only way to discover a macOS break — and the macOS build cannot be
# checked locally at all: the desktop crate compiles Objective-C through
# `objc2-exception-helper`, so `cargo check --target aarch64-apple-darwin` fails
# on a Linux box for want of a toolchain, not for want of working code. The
# daemon crate *does* cross-check, so what only CI can answer is whether the
# Tauri shell builds on a Mac.
#
# `workflow_dispatch` is deliberate: run it by hand before tagging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code and nothing else. The default for a token is whatever the
# repository setting says, which is `write` on plenty of repositories and is a
# credential every third-party action in this file can read. `release.yml` needs
# `contents: write` to publish; this one needs to compile.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: "Linux is fine, macOS is broken" is the answer being
      # asked for, and cancelling the other job hides half of it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
    steps:
      # Pinned by hash, like `release.yml` and `health.yml`: a tag is a moving
      # target that a third party can repoint at other code, and these actions
      # run with the repository token. There is no bot moving them, so bumping
      # one is a deliberate commit — which is the trade, and the safer half of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and a checkout that leaves the token in
          # `.git/config` hands it to every later step — including `npx`, the
          # bundler and every third-party action in the job.
          persist-credentials: false

      - name: System libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf

      # **Pinned, and this is the one place the version is written.** `cargo clippy
      # -D warnings` below is a gate, so an unpinned `stable` means a Rust release
      # six weeks from now can add a lint and fail CI on a commit that touched no
      # Rust at all — red for a reason the diff cannot explain.
      #
      # A `rust-toolchain.toml` was tried and removed, because here it is a silent
      # no-op: `mise env` exports `RUSTUP_TOOLCHAIN=stable`, and that variable
      # outranks the file. So the file would be honoured in CI (no mise) and ignored
      # on every developer's machine (mise always on) — the exact invisible
      # divergence a pin is supposed to remove, and worse than floating.
      #
      # So local stays on mise's `rust = "latest"` and CI is the pinned one. The
      # drift that leaves is the harmless direction: a developer on a newer rustc
      # meets a new lint *before* CI does. The reverse — CI ahead of everyone — is
      # what this prevents.
      #
      # Bumping it is deliberate: raise the version, run
      # `cargo clippy --workspace --all-targets -- -D warnings`, and fix what the new release
      # found in the same commit. To collapse this to one source of truth, CI would
      # have to provision Rust through mise as well (`jdx/mise-action`).
      # `rustfmt` as well as `clippy`: the toolchain action installs only what it
      # is asked for, and `cargo fmt` is a gate here now.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Or the two platforms share one cache key and evict each other.
          key: ${{ matrix.os }}

      # The daemon carries almost every test, including the pid-liveness and
      # instance-lock guards that used to read `/proc` and answered wrongly off
      # Linux. Those are the ones worth running on a Mac. The desktop crate is in
      # for one reason: it writes the macOS `.app` bundle, and this is the only
      # machine that can check that layout against a real Finder's rules.
      - name: Test the daemon
        run: cargo test --workspace

      # Clippy was local-only, so the warnings drifted: 33 of them had
      # accumulated, including two `items_after_test_module` and a
      # `result_large_err`. Denied rather than merely reported, or it drifts again —
      # the tree is clean as of this commit, and the deliberate exceptions carry a
      # targeted `#[allow]` with the reason beside them.
      #
      # On both platforms on purpose: a `#[cfg(target_os = "macos")]` arm is
      # invisible to a Linux clippy, and this repo has several.
      #
      # **`--workspace` is the other load-bearing half.** The root `Cargo.toml` is
      # the `orchd` package *and* the workspace root, so a bare `cargo clippy` lints
      # the current package alone — `desktop/` was never linted here, and it is the
      # crate holding the window, the launcher and the restart handoff. Measured
      # rather than assumed: the same command without the flag prints one
      # `Checking orchd` line and no `orchestrator-desktop`. The crate is clean as of
      # this commit, so widening the gate costs nothing today and stops it drifting
      # the way clippy itself drifted to 33 warnings before it was in CI at all.
      # `cargo fmt` was not this repo's formatter until the tree was formatted in
      # one commit (`.git-blame-ignore-revs` names it, so blame still lands on the
      # reasoning). The rule it replaces was "revert everything outside your own
      # change before committing", which nothing ran and everyone forgot.
      #
      # Linux only: rustfmt's output does not vary by platform.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The doc comments are this repo's design record, and until this step they
      # were the only prose nothing checked. Nine links were dangling when it was
      # first run — `render_prompt_file` and `crate::config::transcript_slug`
      # among them, both renamed or deleted months before — and a pointer that
      # leads nowhere costs a reader a search to find that out.
      #
      # Linux only: doc links do not vary by platform, and the macOS runner is
      # here for what only it can answer.
      - name: Check the doc links
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      # The SPA's own gate, which until now ran *only* in a per-clone pre-commit
      # hook — so a clone that never ran `git config core.hooksPath .githooks` (a
      # fresh one, and CI itself) checked none of it. Five things in one: that
      # `web/snapshot.d.ts` still matches the Rust structs it is generated from,
      # that the SPA type-checks under `--checkJs`, that its module graph is
      # still a DAG, that no promise is dropped and no native dialog is reached
      # for, and that every module in `web/js/` has a route serving it.
      #
      # Linux only: nothing here is platform-dependent, and `tsc` twice buys
      # nothing.
      - name: Set up node
        if: runner.os == 'Linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: SPA dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix tools

      # The prose's own pointers, which nothing checked. A crate move breaks a path
      # in a doc exactly as it breaks one in code — and CLAUDE.md's entry on the
      # layout says the fourth thing such a move broke failed silently. Also here
      # rather than only in the hook, for the reason the SPA gate is: a clone that
      # never ran `git config core.hooksPath .githooks` runs none of it.
      - name: Check the docs
        if: runner.os == 'Linux'
        run: |
          node tools/check-assumptions.mjs
          node tools/check-doc-paths.mjs
          node tools/check-traps.mjs

      # One list, in `tools/check-web.sh`, because this step and `mise run
      # check-web` each used to spell it themselves — and the third copy, in the
      # pre-commit hook, had already lost the palette, the dead-CSS and the
      # drop-list checks. The hook still runs a subset deliberately; these two
      # claim to be the whole gate, so they read from one file.
      - name: Check the SPA
        if: runner.os == 'Linux'
        run: sh tools/check-web.sh

      # The daemon's own module graph, which is now literally the SPA's rule
      # pointed at the crates: no cycle, and no baseline to negotiate with.
      # `tools/rust-modules.mjs` carries the three passes that got it there.
      - name: Check the module graph
        if: runner.os == 'Linux'
        run: node tools/rust-modules.mjs

      # What a release would actually pack. Here rather than only in `release.yml`
      # on purpose: a tag is the one build nobody re-runs, and #16 shipped a
      # version whose app could not start because the release job built `--bin
      # orch` while `child.rs` spawned `orchd`. Everything else in this workflow
      # was green for it — the fault was in the packing, which no test can see.
      - name: Check what a release would ship
        if: runner.os == 'Linux'
        run: node tools/check-ship.mjs

      # What the rendered page must never show: an unresolved `MOD` placeholder,
      # the word `undefined` where a person reads, two sets of window buttons, or
      # anything thrown at boot — each of which has happened here. Chrome is on
      # the ubuntu runner already, so this costs a daemon build and five seconds.
      #
      # Not screenshots, deliberately: `tools/e2e/page.mjs` has the argument.
      #
      # **Both variants, for the reason the renderers run both.** The app's
      # modifier is ⌘ on macOS and Ctrl elsewhere — `appMod`, one rule with two
      # spellings — and the keyboard map, the modifier-click and the window chrome
      # all branch on it. The plain run exercises one side and the `--mac` run the
      # other, which is as close as a Linux box gets: what it cannot answer is
      # whether ⌘ reaches WKWebView at all, or that `Ctrl`-click there is a
      # right-click. `platform` and `chrome` are values the daemon substitutes
      # into the page rather than things the page sniffs, so setting them
      # exercises the real branch.
      - name: Check the page
        if: runner.os == 'Linux'
        run: |
          cargo build -p orchd-serve --bin orchd
          node tools/e2e/page.mjs
          node tools/e2e/page.mjs --mac

      # Which renderer each terminal opens with — the fix for #8, where WKWebView
      # miscomposited xterm's WebGL atlas. It was a `mise` task and nothing else, so
      # the *decision* it pins (agent pane WebGL, drawer terminals DOM, one live
      # context per window) was ungated: the fix could have been silently undone and
      # only a person on a Mac looking at corrupt glyphs would have found out.
      #
      # `renderer.mjs` is honest about what it cannot prove — the corruption needs a
      # real Apple GPU — but "was the fix even active" is the half that is testable,
      # and it is indistinguishable from "the fix did not work" without this. Chrome
      # and `orchd` are both already here, so it costs seconds.
      #
      # **Both variants**, because the browser one is not the rule that matters: the
      # `--mac` run is what asserts the agent pane keeps WebGL while a drawer
      # terminal falls back to the DOM, which *is* #8's fix. `platform` and `chrome`
      # are values the daemon substitutes into the page rather than things the page
      # sniffs, so setting them exercises the real branch.
      - name: Check the renderers
        if: runner.os == 'Linux'
        run: |
          node tools/e2e/renderer.mjs
          node tools/e2e/renderer.mjs --mac

      # The flows, which until now ran **only** in a per-clone pre-commit hook,
      # and there only every fifth qualifying commit. So a fresh clone, a
      # `--no-verify` habit or a contributor who never ran
      # `git config core.hooksPath .githooks` skipped the one suite that drives the
      # daemon end to end — and the class of fault it exists for (a state machine
      # driven by hooks over HTTP against a real git repo) reached nobody.
      #
      # The hook's frugality argument does not apply to a runner: it is ~45s here
      # and nobody is waiting on it. The counter in `.git/` stays, so a local
      # commit still gets the early answer.
      #
      # Offline and deterministic — the agent and the GitHub calls are PATH shims,
      # and `run.mjs` builds both binaries itself. `docs/e2e.md` has the limits.
      #
      # **Both platforms**, which they were not: the argument for Linux-only was that
      # the flows are about git and the daemon, and the macOS runner is there for what
      # only it can answer. That reads well and is wrong in two specific ways this
      # repo has already been bitten by — `$TMPDIR` on macOS is under `/var`, a
      # symlink into `/private`, which `common::scratch_root` canonicalises for
      # precisely because an uncanonicalised path matched nothing there; and the
      # filesystem is case-insensitive, so a branch or worktree name that collides
      # only case-insensitively passes every other gate here.
      #
      # `run.mjs` imports node builtins alone, so this needs no `npm ci` and runs
      # where `Set up node` did not.
      - name: The end-to-end flows
        run: node tools/e2e/run.mjs

      # The part no Linux box can answer, so it runs even when the tests above
      # failed: a red test would otherwise skip this step and hide the one signal
      # that cannot be got anywhere else. Learned the hard way — the first macOS
      # run failed its tests and reported nothing at all about the Tauri build.
      - name: Build the app
        if: always()
        run: cargo build -p orchestrator-desktop

      # **The bundle's architecture, through real LaunchServices.** #18 shipped an
      # `.app` whose `CFBundleExecutable` is a `/bin/sh` script with no
      # `LSArchitecturePriority` beside it, so LaunchServices had no Mach-O to read
      # an architecture from, chose x86_64 first, and every process the app started
      # inherited it — which surfaced as `git` failing to load `libxcrun`. Nothing
      # in the app can see that: `sysctl.proc_translated` answers for the process
      # that asks, and every binary really is arm64.
      #
      # A unit test asserts the key is in the generated plist. This asserts the
      # *effect*, which is only checkable on a Mac — and it is checkable here,
      # because a `workflow_dispatch` probe measured that macos-14 has Rosetta
      # installed and reproduces the bug exactly: the same bundle without the key
      # reports `translated=1` and `uname=x86_64`. `docs/traps/macos.md` carries
      # both numbers.
      #
      # The app's own plist, paired with a probe executable rather than the app
      # itself: LaunchServices reads the architecture out of the plist, and the
      # probe's executable is a `/bin/sh` script, which is the case that launches
      # translated when the key is absent. One `open`, and no window.
      #
      # **The key is belt and braces since #24 rather than the only answer.** The
      # bundle's executable is a copied Mach-O now, so LaunchServices has an
      # architecture to read whatever the plist says. This still guards the
      # generator, and it is the only step that runs LaunchServices at all.
      - name: The bundle runs native
        if: runner.os == 'macOS'
        run: |
          set -eu
          # The bundle copies all three binaries in, because the app resolves
          # `orchd` beside itself — so it refuses to write one until they exist.
          cargo build -p orchd-serve --bins
          ./target/debug/orchestrator-desktop --install-desktop-entry
          app="$HOME/Applications/Orchestrator.app"
          plutil -p "$app/Contents/Info.plist" | grep -i architecture \
            || { echo "::error::no LSArchitecturePriority in the generated plist"; exit 1; }

          probe="$HOME/Applications/ArchProbe.app"
          rm -rf "$probe"; mkdir -p "$probe/Contents/MacOS"
          # The real plist, with only the identity changed so LaunchServices does
          # not confuse this with the app it was generated for.
          # `CFBundleExecutable` as well as the names: it is `orchestrator-desktop`
          # since #24, and a probe whose plist names a binary it does not carry
          # never launches — which reads here as "never ran" rather than as a
          # translated launch.
          sed -e 's/<string>Orchestrator<\/string>/<string>ArchProbe<\/string>/g' \
              -e 's/<string>orchestrator-desktop<\/string>/<string>ArchProbe<\/string>/' \
              -e 's/dev\.orchd\.orchestrator/dev.orchd.archprobe/' \
              "$app/Contents/Info.plist" > "$probe/Contents/Info.plist"
          printf '#!/bin/sh\nsysctl -n sysctl.proc_translated > /tmp/archprobe.txt\n' \
            > "$probe/Contents/MacOS/ArchProbe"
          chmod +x "$probe/Contents/MacOS/ArchProbe"

          rm -f /tmp/archprobe.txt
          open "$probe"
          for _ in $(seq 1 20); do [ -f /tmp/archprobe.txt ] && break; sleep 1; done
          got=$(cat /tmp/archprobe.txt 2>/dev/null || echo "never ran")
          echo "sysctl.proc_translated = $got"
          [ "$got" = "0" ] || {
            echo "::error::the bundle launched translated ($got) — #18 all over again"
            exit 1
          }

      # And then *run* it, which nothing here did until two faults shipped in one
      # week that only running it could have caught: #16 packed no `orchd`, so the
      # app could not start, and #17 seeded a checkout's state with one file, so the
      # rail opened empty. Every other step in this workflow was green for both.
      #
      # **Both platforms, and the Linux half needs Xvfb.** This ran on macOS alone
      # to begin with, on the assumption that a runner with no display cannot open a
      # window — which left the app that ships as a `.deb` and an AppImage built and
      # never executed, so a Linux #16 would have been caught by nothing but
      # `check-ship` reading a config file. Xvfb is enough: measured locally, and
      # measured again with `WEBKIT_DISABLE_COMPOSITING_MODE=0` forced, because the
      # app's own workaround for that only fires under WSL and would not fire here.
      #
      # `orchd` as well as the app, because the host spawns it per checkout and
      # resolves it beside the running executable. `--shots` is a no-op off macOS —
      # `screencapture` is Apple's — so the command stays one line for both.
      - name: Drive the app
        run: |
          cargo build -p orchd-serve --bin orchd
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node tools/app-check.mjs target/debug/orchestrator-desktop
          else
            node tools/app-check.mjs target/debug/orchestrator-desktop \
              --shots "${{ runner.temp }}/app-shots"
          fi

      # Only on a failure: a screenshot is evidence for somebody reading a red run,
      # never something to compare against a baseline — `page-check` says why.
      - name: What it looked like
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-check-shots
          path: ${{ runner.temp }}/app-shots/*.png
          if-no-files-found: ignore
