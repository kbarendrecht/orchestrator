name: check

# Does it still build and pass on both platforms?
#
# This exists because `release.yml` only runs on a tag, which made cutting a
# release the only way to discover a macOS break — and the macOS build cannot be
# checked locally at all: the desktop crate compiles Objective-C through
# `objc2-exception-helper`, so `cargo check --target aarch64-apple-darwin` fails
# on a Linux box for want of a toolchain, not for want of working code. The
# daemon crate *does* cross-check, so what only CI can answer is whether the
# Tauri shell builds on a Mac.
#
# `workflow_dispatch` is deliberate: run it by hand before tagging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code and nothing else. The default for a token is whatever the
# repository setting says, which is `write` on plenty of repositories and is a
# credential every third-party action in this file can read. `release.yml` needs
# `contents: write` to publish; this one needs to compile.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: "Linux is fine, macOS is broken" is the answer being
      # asked for, and cancelling the other job hides half of it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
    steps:
      # Pinned by hash, like `release.yml` and `health.yml`: a tag is a moving
      # target that a third party can repoint at other code, and these actions
      # run with the repository token. There is no bot moving them, so bumping
      # one is a deliberate commit — which is the trade, and the safer half of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and a checkout that leaves the token in
          # `.git/config` hands it to every later step — including `npx`, the
          # bundler and every third-party action in the job.
          persist-credentials: false

      - name: System libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf

      # **Pinned, and this is the one place the version is written.** `cargo clippy
      # -D warnings` below is a gate, so an unpinned `stable` means a Rust release
      # six weeks from now can add a lint and fail CI on a commit that touched no
      # Rust at all — red for a reason the diff cannot explain.
      #
      # A `rust-toolchain.toml` was tried and removed, because here it is a silent
      # no-op: `mise env` exports `RUSTUP_TOOLCHAIN=stable`, and that variable
      # outranks the file. So the file would be honoured in CI (no mise) and ignored
      # on every developer's machine (mise always on) — the exact invisible
      # divergence a pin is supposed to remove, and worse than floating.
      #
      # So local stays on mise's `rust = "latest"` and CI is the pinned one. The
      # drift that leaves is the harmless direction: a developer on a newer rustc
      # meets a new lint *before* CI does. The reverse — CI ahead of everyone — is
      # what this prevents.
      #
      # Bumping it is deliberate: raise the version, run
      # `cargo clippy --workspace --all-targets -- -D warnings`, and fix what the new release
      # found in the same commit. To collapse this to one source of truth, CI would
      # have to provision Rust through mise as well (`jdx/mise-action`).
      # `rustfmt` as well as `clippy`: the toolchain action installs only what it
      # is asked for, and `cargo fmt` is a gate here now.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Or the two platforms share one cache key and evict each other.
          key: ${{ matrix.os }}

      # The daemon carries almost every test, including the pid-liveness and
      # instance-lock guards that used to read `/proc` and answered wrongly off
      # Linux. Those are the ones worth running on a Mac. The desktop crate is in
      # for one reason: it writes the macOS `.app` bundle, and this is the only
      # machine that can check that layout against a real Finder's rules.
      - name: Test the daemon
        run: cargo test --workspace

      # Clippy was local-only, so the warnings drifted: 33 of them had
      # accumulated, including two `items_after_test_module` and a
      # `result_large_err`. Denied rather than merely reported, or it drifts again —
      # the tree is clean as of this commit, and the deliberate exceptions carry a
      # targeted `#[allow]` with the reason beside them.
      #
      # On both platforms on purpose: a `#[cfg(target_os = "macos")]` arm is
      # invisible to a Linux clippy, and this repo has several.
      #
      # **`--workspace` is the other load-bearing half.** The root `Cargo.toml` is
      # the `orchd` package *and* the workspace root, so a bare `cargo clippy` lints
      # the current package alone — `desktop/` was never linted here, and it is the
      # crate holding the window, the launcher and the restart handoff. Measured
      # rather than assumed: the same command without the flag prints one
      # `Checking orchd` line and no `orchestrator-desktop`. The crate is clean as of
      # this commit, so widening the gate costs nothing today and stops it drifting
      # the way clippy itself drifted to 33 warnings before it was in CI at all.
      # `cargo fmt` was not this repo's formatter until the tree was formatted in
      # one commit (`.git-blame-ignore-revs` names it, so blame still lands on the
      # reasoning). The rule it replaces was "revert everything outside your own
      # change before committing", which nothing ran and everyone forgot.
      #
      # Linux only: rustfmt's output does not vary by platform.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The doc comments are this repo's design record, and until this step they
      # were the only prose nothing checked. Nine links were dangling when it was
      # first run — `render_prompt_file` and `crate::config::transcript_slug`
      # among them, both renamed or deleted months before — and a pointer that
      # leads nowhere costs a reader a search to find that out.
      #
      # Linux only: doc links do not vary by platform, and the macOS runner is
      # here for what only it can answer.
      - name: Check the doc links
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      # The SPA's own gate, which until now ran *only* in a per-clone pre-commit
      # hook — so a clone that never ran `git config core.hooksPath .githooks` (a
      # fresh one, and CI itself) checked none of it. Five things in one: that
      # `web/snapshot.d.ts` still matches the Rust structs it is generated from,
      # that the SPA type-checks under `--checkJs`, that its module graph is
      # still a DAG, that no promise is dropped and no native dialog is reached
      # for, and that every module in `web/js/` has a route serving it.
      #
      # Linux only: nothing here is platform-dependent, and `tsc` twice buys
      # nothing.
      - name: Set up node
        if: runner.os == 'Linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: SPA dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix tools

      - name: Check the SPA
        if: runner.os == 'Linux'
        run: |
          # Top of the graph down: ts-rs exports a type's dependencies too, so a
          # crate's run rewrites its dependencies' files with only the subset it
          # references. This order leaves each file written by its owner.
          for crate in orchd-serve orchd orchd-repo orchd-base; do
            cargo test -p "$crate" --lib export_bindings >/dev/null
          done
          git diff --exit-code --stat web/snapshot.d.ts web/base.d.ts web/repo.d.ts web/serve.d.ts \
            || { echo 'the generated types are stale: run `mise run check-web` and commit them.'; exit 1; }
          npx --prefix tools tsc -p tools/tsconfig.json
          npx --prefix tools depcruise --config tools/.dependency-cruiser.cjs web/app.js
          npx --prefix tools eslint --config tools/eslint.config.mjs web
          node tools/check-module-routes.mjs

      # What the rendered page must never show: an unresolved `MOD` placeholder,
      # the word `undefined` where a person reads, two sets of window buttons, or
      # anything thrown at boot — each of which has happened here. Chrome is on
      # the ubuntu runner already, so this costs a daemon build and five seconds.
      #
      # Not screenshots, deliberately: `tools/e2e/page.mjs` has the argument.
      # The daemon's own module graph, which is the SPA's rule pointed at `src/`.
      # A ratchet, not a gate: `tools/rust-modules.mjs` has the argument.
      - name: Check the module graph
        if: runner.os == 'Linux'
        run: node tools/rust-modules.mjs

      - name: Check the page
        if: runner.os == 'Linux'
        run: |
          cargo build -p orchd-serve --bin orchd
          node tools/e2e/page.mjs

      # The part no Linux box can answer, so it runs even when the tests above
      # failed: a red test would otherwise skip this step and hide the one signal
      # that cannot be got anywhere else. Learned the hard way — the first macOS
      # run failed its tests and reported nothing at all about the Tauri build.
      - name: Build the app
        if: always()
        run: cargo build -p orchestrator-desktop
