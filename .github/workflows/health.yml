name: health

# What the shipped binaries contain, checked on a calendar rather than on a push.
#
# `check.yml` answers "does this commit build and pass". Nothing answered "is a
# dependency of ours now known to be vulnerable", and that question changes
# without anybody touching the repo — an advisory is published against a crate
# that was fine yesterday, and a desktop app that redistributes ~490 of them
# hears nothing. So this runs weekly as well as on a push that moves a manifest.
#
# Deliberately separate from `check.yml`: a red build here means "go and read an
# advisory", not "your commit is broken", and mixing the two teaches people to
# ignore the one that matters.
#
# No `paths:` filter, deliberately. It had one, and it meant a misspelling in a
# `.rs` commit waited for the next Monday — the job is ~20s with prebuilt
# binaries, so filtering it bought nothing and delayed three of its four checks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning, so a week's advisories are read on a working day rather
    # than found during a release.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and a checkout that leaves the token in
          # `.git/config` hands it to every later step — including `npx`, the
          # bundler and every third-party action in the job.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      # Prebuilt binaries. Building `cargo-deny` and friends from source is
      # several minutes of a job whose own work takes seconds.
      #
      # **Pinned, and this is the same rule as the Rust toolchain pin in
      # `check.yml`.** These are linters whose *configuration* they parse, so a
      # newer one is a red build on a commit that touched nothing: the first run
      # of this workflow failed because the version CI picked rejected
      # `AGPL-3.0-only` in `deny.toml` and wanted the bare `AGPL-3.0`, while the
      # version here rejects the bare form. One spelling cannot satisfy both, so
      # the version is the thing that has to be said out loud.
      #
      # Bumping is deliberate: raise these, run `mise run check-deps` and
      # `mise run notices`, and fix what the new version found in the same commit.
      - uses: taiki-e/install-action@d31232495ad76f47aad66e3501e47780b49f0f3e # v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2,cargo-machete@0.9.2,typos-cli@1.50.1

      # Advisories, licences, banned crates and unknown sources. `deny.toml` has
      # the argument for each, including the one advisory that is recorded rather
      # than fixed.
      - name: Dependencies
        run: cargo deny --workspace check

      # An unused dependency is a crate compiled into nothing, and it found one
      # the day it was first run.
      - name: Unused dependencies
        run: cargo machete

      # Regenerate and diff, the same shape `web/snapshot.d.ts` uses: the file in
      # the tree is the answer, and CI's job is to say when it stopped being.
      #
      # This is the half `THIRD-PARTY.md` never had. That file lists the vendored
      # JavaScript because it ships inside the binary — and so do ~490 crates,
      # whose MIT and Apache terms ask for the same notice to travel along.
      - name: Third-party notices
        run: |
          cargo about generate --fail --workspace about.hbs > THIRD-PARTY-RUST.md
          git diff --exit-code --stat THIRD-PARTY-RUST.md \
            || { echo 'THIRD-PARTY-RUST.md is stale: run `mise run notices` and commit it.'; exit 1; }

      # The prose is the design record here, so a misspelling in it outlives the
      # code it describes.
      - name: Spelling
        run: typos

      # The workflows themselves. It is what would have caught the four unpinned
      # actions in `check.yml` — pinned now — and it found three checkouts leaving
      # the repository token in `.git/config` for every later step, plus a release
      # build that could write the shared cache it installs from.
      #
      # `--min-severity low` drops one informational finding we disagree with:
      # `softprops/action-gh-release` over a `gh release` script step. That action
      # handles the multi-asset upload and the retry, which is the whole of what
      # the release job needs from it.
      #
      # `--offline` because every audit that matters here reads the files; the
      # online ones ask GitHub about the actions and would need a token.
      - name: Workflows
        run: |
          pipx install zizmor==1.30.1
          zizmor --offline --min-severity low .github/workflows
