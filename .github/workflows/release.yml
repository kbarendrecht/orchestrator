name: release

# Tag a version to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The binary lands as a release asset that `mise`/`ubi` can install and upgrade.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # One artifact per platform, and a break on either fails the release rather
      # than shipping half of it.
      fail-fast: false
      matrix:
        include:
          # 22.04 is the WebKitGTK 4.1 baseline; 20.04 ships only 4.0 and cannot
          # build.
          - os: ubuntu-22.04
            slug: x86_64-linux
            # Both, because they answer different questions: the `.deb` is the one
            # that installs (menu entry, icon, `orch` on PATH, apt removes it), and
            # the AppImage is for everything that is not Debian. It is the one that
            # costs: measured locally, the deb adds seconds to a build that already
            # happens and weighs 6.5 MB, the AppImage adds ~55s and weighs 79 MB,
            # because it carries its own GTK/WebKit tree.
            bundles: deb,appimage
          # macos-14 is the Apple Silicon runner, so the host target is
          # aarch64-apple-darwin and no `--target` is needed. Intel Macs are not
          # built for: every Mac sold since 2020 is arm64, and a second runner
          # doubles macOS minutes for machines nobody here has. Tauri uses the
          # system WKWebView, so unlike Linux there are no libraries to install.
          - os: macos-14
            slug: aarch64-macos
            # Unsigned, so Gatekeeper asks the first time. Still better than a
            # tarball, and signing wants a paid Developer ID.
            bundles: dmg
    steps:
      # **Actions pinned by SHA, not by tag.** A tag is a mutable pointer: whoever
      # owns the action can move `v7` to any commit, and this workflow hands what it
      # runs `contents: write` on this repository plus whatever the release step can
      # reach. The version each SHA corresponds to is in the comment, which is what
      # makes a bump reviewable — `gh api repos/<owner>/<repo>/commits/<tag> --jq
      # .sha` is how to resolve the next one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tag matches the version the app reports
        run: |
          # The update nudge compares releases against orchd's own
          # env!("CARGO_PKG_VERSION"), i.e. the root Cargo.toml version. If the
          # tag and that version drift, a released build nags about "an update"
          # that it already is. Refuse to release a mismatch.
          #
          # **All three files, not just the root one.** CLAUDE.md's release steps
          # say to bump `Cargo.toml`, `desktop/Cargo.toml` and `tauri.conf.json`
          # together, and this only ever checked the first — so a release could
          # ship a `.deb` and a `.dmg` whose bundle version disagreed with the
          # binary inside them, which is the half nobody notices until an upgrade
          # behaves oddly. Checking what the docs already require costs nothing.
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error file=$1::$1 says $2, but the tag says $tag — bump it before tagging"
              fail=1
            fi
          }
          check Cargo.toml \
            "$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          check desktop/Cargo.toml \
            "$(grep -m1 '^version' desktop/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          check desktop/tauri.conf.json \
            "$(grep -m1 '"version"' desktop/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          exit "$fail"

      - name: System libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf

      # Pinned, and kept in step with `check.yml` by hand — the two are the same
      # string in two workflows, which is the cost of GitHub Actions having no
      # shared value. This is the workflow that produces the artifact people
      # install, so a floating toolchain here means a release could be built by a
      # compiler nothing was ever tested on: `check.yml` is what proves a version
      # good, and it can only prove the version it actually used.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # **Nothing is published from an untested tree.** `check.yml` runs the suite
      # on pushes to `main`, but a tag is not a push to `main`: it can name any
      # commit, including one that never went through it or one whose run was red.
      # Placed before the build, so a failure here happens before this job has
      # uploaded anything.
      - name: Test
        run: cargo test -p orchd -p orchestrator-desktop

      - name: Build
        run: |
          # `orch` first, and not only for the tarball: every bundle copies it in
          # beside the app (the per-bundle `files` maps in tauri.conf.json), so it
          # has to exist before the bundler runs. A binary that has to be installed
          # separately is one that is not there when an agent reaches for it.
          cargo build --release --bin orch
          # The npm CLI ships a prebuilt binary; `cargo install tauri-cli` would
          # spend minutes compiling one on every release. This also builds
          # `orchestrator-desktop --release`, which is why that step is gone.
          # Pinned exactly, not `^2`: the bundler decides the layout of the
          # `.deb`, the AppImage and the `.dmg`, so a minor release of it can change
          # what ships without a line of this repo changing — and a release is the
          # one build nobody re-runs to compare. Bump it deliberately, like the
          # toolchain.
          npx -y @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundles }}

      - name: Package
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          # The tarball stays, and is what `mise`/`ubi` install: they read a release
          # asset and extract by exe name, and neither can open a .deb. The app
          # embeds the SPA (include_str!), so it is two executables and nothing
          # else — the app, and the `orch` CLI its sessions use to talk back to it.
          tar -C target/release -czf "dist/orchestrator-${tag}-${{ matrix.slug }}.tar.gz" \
            orchestrator-desktop orch
          # Whatever the bundler produced, under its own conventional name: a .deb
          # is named the way apt expects, not the way the tarball is.
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec mv {} dist/ \;
          # `for f in *` expands once, before the loop writes anything, so the sums
          # do not get sums of their own.
          cd dist
          for f in *; do
            # macOS has `shasum`, not GNU coreutils' `sha256sum`.
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -lh

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
