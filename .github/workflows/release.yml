name: release

# Tag a version to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The binary lands as a release asset that `mise`/`ubi` can install and upgrade.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # One artifact per platform, and a break on either fails the release rather
      # than shipping half of it.
      fail-fast: false
      matrix:
        include:
          # 22.04 is the WebKitGTK 4.1 baseline; 20.04 ships only 4.0 and cannot
          # build.
          - os: ubuntu-22.04
            slug: x86_64-linux
          # macos-14 is the Apple Silicon runner, so the host target is
          # aarch64-apple-darwin and no `--target` is needed. Intel Macs are not
          # built for: every Mac sold since 2020 is arm64, and a second runner
          # doubles macOS minutes for machines nobody here has. Tauri uses the
          # system WKWebView, so unlike Linux there are no libraries to install.
          - os: macos-14
            slug: aarch64-macos
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version the app reports
        run: |
          # The update nudge compares releases against orchd's own
          # env!("CARGO_PKG_VERSION"), i.e. the root Cargo.toml version. If the
          # tag and that version drift, a released build nags about "an update"
          # that it already is. Refuse to release a mismatch.
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag != orchd crate version $crate — bump Cargo.toml before tagging"
            exit 1
          fi

      - name: System libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release -p orchestrator-desktop
          # The CLI a session uses to reach the daemon. Same tarball, because a
          # binary that has to be installed separately is one that is not there
          # when an agent reaches for it.
          cargo build --release --bin orch

      - name: Package
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="orchestrator-${tag}-${{ matrix.slug }}.tar.gz"
          # The app embeds the SPA (include_str!), so the tarball is two
          # executables and nothing else: the app, and the `orch` CLI its sessions
          # use to talk back to it. ubi extracts by the exe name below.
          tar -C target/release -czf "$asset" orchestrator-desktop orch
          # macOS has `shasum`, not GNU coreutils' `sha256sum`.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          generate_release_notes: true
