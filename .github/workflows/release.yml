name: release

# Tag a version to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The binary lands as a release asset that `mise`/`ubi` can install and upgrade.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # 22.04 is the WebKitGTK 4.1 baseline; 20.04 ships only 4.0 and cannot build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version the app reports
        run: |
          # The update nudge compares releases against orchd's own
          # env!("CARGO_PKG_VERSION"), i.e. the root Cargo.toml version. If the
          # tag and that version drift, a released build nags about "an update"
          # that it already is. Refuse to release a mismatch.
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag != orchd crate version $crate — bump Cargo.toml before tagging"
            exit 1
          fi

      - name: System libraries (Tauri/WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p orchestrator-desktop

      - name: Package
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="orchestrator-${tag}-x86_64-linux.tar.gz"
          # The binary embeds the SPA (include_str!), so the tarball is the one
          # executable and nothing else. ubi extracts it by the exe name below.
          tar -C target/release -czf "$asset" orchestrator-desktop
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          generate_release_notes: true
