name: release

# Tag a version to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The binary lands as a release asset that `mise`/`ubi` can install and upgrade.
on:
  push:
    tags:
      - "v*"

# Read by default; only the `release` job below is granted `contents: write`. The
# build jobs run a compiler, a bundler and `npx` over the network, and none of that
# needs the ability to publish.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Not cancelled on a failure, because "Linux built, macOS did not" is the
      # answer worth having — and it is safe to let the other finish now that
      # nothing here publishes. The `release` job `needs` this one, so a red leg
      # means no release at all rather than a partial one.
      fail-fast: false
      matrix:
        include:
          # 22.04 is the WebKitGTK 4.1 baseline; 20.04 ships only 4.0 and cannot
          # build.
          - os: ubuntu-22.04
            slug: x86_64-linux
            # Both, because they answer different questions: the `.deb` is the one
            # that installs (menu entry, icon, `orch` on PATH, apt removes it), and
            # the AppImage is for everything that is not Debian. It is the one that
            # costs: measured locally, the deb adds seconds to a build that already
            # happens and weighs 6.5 MB, the AppImage adds ~55s and weighs 79 MB,
            # because it carries its own GTK/WebKit tree.
            bundles: deb,appimage
          # macos-14 is the Apple Silicon runner, so the host target is
          # aarch64-apple-darwin and no `--target` is needed. Intel Macs are not
          # built for: every Mac sold since 2020 is arm64, and a second runner
          # doubles macOS minutes for machines nobody here has. Tauri uses the
          # system WKWebView, so unlike Linux there are no libraries to install.
          - os: macos-14
            slug: aarch64-macos
            # Unsigned, so Gatekeeper asks the first time. Still better than a
            # tarball, and signing wants a paid Developer ID.
            #
            # **`app` as well as `dmg`, and that is not a second artifact.** The
            # bundler treats `Orchestrator.app` as scratch when only `dmg` is
            # asked for: it packs the dmg and then *deletes* it — "Cleaning
            # …/bundle/macos/Orchestrator.app", right before "Drive what this
            # will ship" reaches into that path. Naming `app` keeps the tree the
            # dmg was built from. Nothing extra is uploaded, because `Package`
            # matches `-type f` and an `.app` is a directory.
            bundles: app,dmg
    steps:
      # **Actions pinned by SHA, not by tag.** A tag is a mutable pointer: whoever
      # owns the action can move `v7` to any commit, and this workflow hands what it
      # runs `contents: write` on this repository plus whatever the release step can
      # reach. The version each SHA corresponds to is in the comment, which is what
      # makes a bump reviewable — `gh api repos/<owner>/<repo>/commits/<tag> --jq
      # .sha` is how to resolve the next one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and a checkout that leaves the token in
          # `.git/config` hands it to every later step — including `npx`, the
          # bundler and every third-party action in the job.
          persist-credentials: false

      - name: Tag matches the version the app reports
        run: |
          # The update nudge compares releases against orchd's own
          # env!("CARGO_PKG_VERSION"). If the tag and that version drift, a
          # released build nags about "an update" that it already is. Refuse to
          # release a mismatch.
          #
          # **Two files, because cargo holds the rest.** Every crate says
          # `version.workspace = true`, so `[workspace.package]` in the root is the
          # one literal a crate can disagree with — and cargo refuses to build the
          # disagreement, which is stronger than a grep here. `tauri.conf.json` is
          # the bundler's own copy and nothing checks it but this: a `.deb` and a
          # `.dmg` whose bundle version disagreed with the binary inside them is
          # the half nobody notices until an upgrade behaves oddly.
          #
          # This step read `^version` out of the root when the root had stopped
          # carrying one — the crate split moved it — so it compared the empty
          # string against every tag. Nothing failed until somebody tried to
          # release; the workspace version above is what put it back.
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error file=$1::$1 says '$2', but the tag says $tag — bump it before tagging"
              fail=1
            fi
          }
          check Cargo.toml \
            "$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          check desktop/tauri.conf.json \
            "$(grep -m1 '"version"' desktop/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          exit "$fail"

      - name: System libraries (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf

      # Pinned, and kept in step with `check.yml` by hand — the two are the same
      # string in two workflows, which is the cost of GitHub Actions having no
      # shared value. This is the workflow that produces the artifact people
      # install, so a floating toolchain here means a release could be built by a
      # compiler nothing was ever tested on: `check.yml` is what proves a version
      # good, and it can only prove the version it actually used.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Read the cache, never write it. A tag build is the one job whose
          # output people install, and a cache entry poisoned by any earlier run
          # would end up inside it.
          lookup-only: true

      # **Nothing is published from an untested tree.** `check.yml` runs the suite
      # on pushes to `main`, but a tag is not a push to `main`: it can name any
      # commit, including one that never went through it or one whose run was red.
      # Placed before the build, so a failure here happens before this job has
      # uploaded anything.
      - name: Test
        run: cargo test --workspace

      # The last gate in front of a spent version number. `check.yml` runs this on
      # every push to `main`, but a tag can name any commit — and the failure it
      # guards is the one nobody re-runs a release to find: v2026.9.14 packed no
      # `orchd`, so every install of it failed at startup (#16). Node is already
      # here for the bundler's `npx`.
      - name: Check what this will ship
        run: node tools/check-ship.mjs

      - name: Build
        run: |
          # The CLI *and* the daemon, before the bundler: every bundle copies both
          # in beside the app (the per-bundle `files` maps in tauri.conf.json), so
          # they have to exist by the time it runs. A binary that has to be
          # installed separately is one that is not there when the app reaches for
          # it — which is exactly what v2026.9.14 shipped (#16): the app spawns a
          # separate `orchd` per checkout and no asset carried one, so a fresh
          # install could not start at all.
          #
          # `--bins`, not a list: a fourth binary would otherwise be missing here
          # and nowhere else, and `mise run check-ship` holds the other end.
          cargo build --release -p orchd-serve --bins
          # The npm CLI ships a prebuilt binary; `cargo install tauri-cli` would
          # spend minutes compiling one on every release. This also builds
          # `orchestrator-desktop --release`, which is why that step is gone.
          # Pinned exactly, not `^2`: the bundler decides the layout of the
          # `.deb`, the AppImage and the `.dmg`, so a minor release of it can change
          # what ships without a line of this repo changing — and a release is the
          # one build nobody re-runs to compare. Bump it deliberately, like the
          # toolchain.
          npx -y @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundles }}

      # The packed app, driven before anything is uploaded. `check-ship` reads the
      # config and says the bundle *should* carry `orchd`; this opens the bundle
      # that was actually built and makes a session in it. A tag is the one build
      # nobody re-runs, and v2026.9.14 shipped an app that could not start.
      #
      # macOS only: the Linux runner has no display for the window.
      #
      # **This step had never run when it was written**, and it failed on its
      # first release: `check` drives the plain binary, so nothing exercised the
      # bundle path until v2026.9.16 spent a version number on it. The bundler
      # deletes the `.app` when only `dmg` is asked for — see `bundles` above.
      # Fail loudly here rather than let a missing path read as a usage error.
      - name: Drive what this will ship
        if: runner.os == 'macOS'
        run: |
          app=target/release/bundle/macos/Orchestrator.app/Contents/MacOS/orchestrator-desktop
          test -x "$app" || {
            echo "::error::the bundler left no $app — did the bundle list drop 'app'?"
            ls -R target/release/bundle || true
            exit 1
          }
          node tools/app-check.mjs "$app"

      - name: Package
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          # The tarball stays, and is what `mise`/`ubi` install: they read a release
          # asset and extract by exe name, and neither can open a .deb. The app
          # embeds the SPA (include_str!), so what ships is three executables and
          # nothing else — the app, the `orchd` daemon it spawns per checkout, and
          # the `orch` CLI its sessions use to talk back to it.
          tar -C target/release -czf "dist/orchestrator-${tag}-${{ matrix.slug }}.tar.gz" \
            orchestrator-desktop orchd orch
          # Whatever the bundler produced, under its own conventional name: a .deb
          # is named the way apt expects, not the way the tarball is.
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec mv {} dist/ \;
          # `for f in *` expands once, before the loop writes anything, so the sums
          # do not get sums of their own.
          cd dist
          for f in *; do
            # macOS has `shasum`, not GNU coreutils' `sha256sum`.
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -lh

      # Handed to the `release` job rather than published here — see the comment
      # on that job. `error` on an empty upload, because a silently empty artifact
      # would become a silently incomplete release.
      - name: Keep the artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.slug }}
          path: dist/
          if-no-files-found: error

  # **One release, made once, only if every platform built.**
  #
  # This used to be a step inside the matrix, so each platform published its own
  # assets as it finished — and with `fail-fast: false` that meant a macOS failure
  # after Linux had already uploaded left a real, announced release carrying half
  # its assets. The matrix comment claimed the opposite ("a break on either fails
  # the release rather than shipping half of it"), which is the shape of comment
  # worth distrusting: it described an intention, not the workflow.
  #
  # `needs: build` is the whole fix. It waits for every leg and runs only if all of
  # them succeeded, so a red platform means no release rather than a partial one —
  # and nothing is published until every asset exists.
  release:
    needs: build
    runs-on: ubuntu-22.04
    # The one place that may write, and it does nothing else.
    permissions:
      contents: write
    steps:
      # `merge-multiple`, because v4 requires a distinct name per upload: the two
      # `dist-<slug>` artifacts land in one directory again here.
      - name: Collect every platform's assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # **The notes ride on the tag, which is why this job now checks out.** It
      # used to take `generate_release_notes: true`, which builds a body out of
      # merged pull requests — and this repo commits straight to `main`, so there
      # were none and every release published the same single compare link, for 8
      # commits in v2026.9.18 and 34 in v2026.9.17. `mise run release` writes the
      # notes into the annotated tag, where a person has already read them, and
      # this reads that message back. Tags only, and no history, because the
      # message is the whole of what is needed.
      - name: Read the notes off the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # **`contents: write` is granted here, so the token must not be left in
          # `.git/config`.** zizmor's `artipacked` audit refused the checkout
          # without this and took `health` red on the commit that added it — the
          # gate doing its job on the first privileged checkout this workflow ever
          # had. Nothing after the clone needs a credential: the tag's message is
          # read locally.
          persist-credentials: false
      - name: The tag's own message
        id: notes
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # **Only an annotated tag has a message of its own.** `%(contents)` on a
          # lightweight tag hands back the *commit's* message instead, so a release
          # cut by hand would have published "Release 2026.9.19" as its body and
          # looked deliberate. `cat-file -t` is what tells the two apart.
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents)' "$tag" > notes.md
          else
            printf '**Full Changelog**: %s/compare/%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tag" > notes.md
          fi
          printf 'the body is %s line(s)\n' "$(wc -l < notes.md)"

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          body_path: notes.md
