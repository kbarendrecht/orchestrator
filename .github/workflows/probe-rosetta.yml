# Throwaway. Answers one question and is then deleted, the same way the earlier
# macOS experiment in `docs/traps/macos.md` was: its findings are the whole of
# what it is for.
#
# **Would the missing `LSArchitecturePriority` have reproduced on a runner?**
# `docs/traps/macos.md` records that a shell-script `CFBundleExecutable` leaves
# LaunchServices with no Mach-O to read an architecture from, so it built
# `BinaryOrderPreference = {x86_64, arm64}` and the app ran translated. That is
# worth a CI gate only if a runner can translate anything at all — with no Rosetta
# installed an x86_64 preference cannot take effect, the bug would never have
# reproduced here, and a check asserting its absence would guard nothing.
#
# The mechanism is reproduced in miniature rather than by building the app: two
# bundles differing only in that key, each with a `/bin/sh` script as its
# executable, launched through `open` exactly as LaunchServices would launch ours.
# `sysctl.proc_translated` is per process, so the script asking it answers for
# itself — which is the process class that actually inherits the preference.
name: probe-rosetta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    steps:
      - name: Is Rosetta installed at all?
        run: |
          echo "arch:            $(uname -m)"
          echo "macOS:           $(sw_vers -productVersion)"
          echo "oahd running:    $(pgrep -x oahd >/dev/null && echo yes || echo no)"
          echo "oahd on disk:    $([ -e /usr/libexec/rosetta/oahd ] && echo yes || echo no)"
          # The direct question: can this machine execute x86_64 at all?
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "x86_64 exec:     yes"
          else
            echo "x86_64 exec:     NO — an x86_64 preference cannot take effect here"
          fi

      - name: What does LaunchServices do with a shell-script bundle?
        run: |
          set -u
          make_bundle() {
            name="$1"; arch_key="$2"
            app="$HOME/Applications/$name.app"
            rm -rf "$app"; mkdir -p "$app/Contents/MacOS"
            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$name</string>
            <key>CFBundleExecutable</key><string>$name</string>
            <key>CFBundleIdentifier</key><string>dev.orchd.probe.$name</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
          $arch_key
          </dict>
          </plist>
          PLIST
            # The same shape ours has: a /bin/sh script, which is universal, so
            # LaunchServices has no architecture to read off it.
            cat > "$app/Contents/MacOS/$name" <<SCRIPT
          #!/bin/sh
          {
            echo "translated=\$(sysctl -n sysctl.proc_translated 2>/dev/null || echo unset)"
            echo "uname=\$(uname -m)"
          } > "/tmp/probe-$name.txt"
          SCRIPT
            chmod +x "$app/Contents/MacOS/$name"
          }

          make_bundle NoArchKey ""
          make_bundle WithArchKey "  <key>LSArchitecturePriority</key><array><string>arm64</string></array>"

          for name in NoArchKey WithArchKey; do
            rm -f "/tmp/probe-$name.txt"
            open "$HOME/Applications/$name.app" || echo "open $name failed"
          done
          sleep 8

          for name in NoArchKey WithArchKey; do
            echo "── $name ──"
            if [ -f "/tmp/probe-$name.txt" ]; then
              cat "/tmp/probe-$name.txt"
            else
              echo "the bundle never ran (nothing written)"
            fi
          done

          echo "── what LaunchServices recorded ──"
          # `1` in `translated` above is the finding. This is the corroboration:
          # the order LaunchServices chose, if the tooling will say.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -dump 2>/dev/null | grep -iA2 "dev.orchd.probe" | head -40 || echo "lsregister said nothing"
